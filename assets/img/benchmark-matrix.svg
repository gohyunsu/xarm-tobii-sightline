<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 510" role="img" aria-labelledby="title desc">
  <title id="title">GazePick benchmark conditions</title><desc id="desc">Five conditions isolate language, classical gaze, gaze prompting, VLA adaptation, and an explicit click oracle.</desc>
  <rect width="1120" height="510" rx="28" fill="#fbfcfc"/><g font-family="system-ui"><text x="50" y="50" fill="#5f7180" font-size="16" font-weight="800" letter-spacing="2">THE COMPARISON THAT MAKES THE PROJECT SCIENTIFIC</text>
  <g transform="translate(50 90)"><rect width="1020" height="52" rx="14" fill="#17364c"/><text x="22" y="33" fill="white" font-size="14" font-weight="800">CONDITION</text><text x="236" y="33" fill="white" font-size="14" font-weight="800">REFERENT INPUT</text><text x="465" y="33" fill="white" font-size="14" font-weight="800">POLICY</text><text x="700" y="33" fill="white" font-size="14" font-weight="800">WHAT IT ISOLATES</text>
  <g transform="translate(0 66)"><rect width="1020" height="58" rx="12" fill="#fff" stroke="#d7e0e2"/><text x="22" y="36" fill="#17364c" font-size="16" font-weight="850">B0 · Language only</text><text x="236" y="36" fill="#536a78" font-size="15">words</text><text x="465" y="36" fill="#536a78" font-size="15">frozen/standard</text><text x="700" y="36" fill="#536a78" font-size="15">the ambiguity problem</text></g>
  <g transform="translate(0 132)"><rect width="1020" height="58" rx="12" fill="#fff" stroke="#d7e0e2"/><text x="22" y="36" fill="#17364c" font-size="16" font-weight="850">B1 · Classical gaze snap</text><text x="236" y="36" fill="#536a78" font-size="15">nearest object/AOI</text><text x="465" y="36" fill="#536a78" font-size="15">scripted skill</text><text x="700" y="36" fill="#536a78" font-size="15">whether VLA is necessary</text></g>
  <g transform="translate(0 198)"><rect width="1020" height="58" rx="12" fill="#e3f3f3" stroke="#9bcacc"/><text x="22" y="36" fill="#087e8b" font-size="16" font-weight="850">B2 · Gaze prompt</text><text x="236" y="36" fill="#536a78" font-size="15">uncertain mask/heatmap</text><text x="465" y="36" fill="#536a78" font-size="15">frozen VLA</text><text x="700" y="36" fill="#536a78" font-size="15">inference-time fusion</text></g>
  <g transform="translate(0 264)"><rect width="1020" height="58" rx="12" fill="#fff0e9" stroke="#e2b0a2"/><text x="22" y="36" fill="#bd4f37" font-size="16" font-weight="850">B3 · Gaze + xArm adaptation</text><text x="236" y="36" fill="#536a78" font-size="15">same uncertain cue</text><text x="465" y="36" fill="#536a78" font-size="15">LoRA/OFT</text><text x="700" y="36" fill="#536a78" font-size="15">incremental fine-tuning value</text></g>
  <g transform="translate(0 330)"><rect width="1020" height="58" rx="12" fill="#e9f4ed" stroke="#a9cdb6"/><text x="22" y="36" fill="#2d7a4c" font-size="16" font-weight="850">B4 · Click oracle</text><text x="236" y="36" fill="#536a78" font-size="15">explicit target click</text><text x="465" y="36" fill="#536a78" font-size="15">matched skill/VLA</text><text x="700" y="36" fill="#536a78" font-size="15">interface upper bound + cost</text></g></g></g>
</svg>
