<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc">
  <title id="title">GazePick execution state machine</title><desc id="desc">The system moves from idle to referent estimation, clarification or confirmation, guarded execution, verification, and recovery.</desc>
  <rect width="1120" height="430" rx="28" fill="#fbfcfc"/><g font-family="system-ui"><text x="50" y="50" fill="#5f7180" font-size="16" font-weight="800" letter-spacing="2">UNCERTAINTY MUST CHANGE SYSTEM BEHAVIOR</text>
  <g font-size="15" font-weight="800" text-anchor="middle"><g transform="translate(60 150)"><rect width="135" height="72" rx="18" fill="#edf1f6" stroke="#b5c3ce"/><text x="67" y="44" fill="#17364c">IDLE</text></g><g transform="translate(250 150)"><rect width="165" height="72" rx="18" fill="#e2f3f3" stroke="#91c8cb"/><text x="82" y="35" fill="#087e8b">ESTIMATE</text><text x="82" y="55" fill="#087e8b">REFERENT</text></g><g transform="translate(485 82)"><rect width="165" height="72" rx="18" fill="#fff0e9" stroke="#dfab9d"/><text x="82" y="35" fill="#ba4d35">CLARIFY /</text><text x="82" y="55" fill="#ba4d35">RECALIBRATE</text></g><g transform="translate(485 236)"><rect width="165" height="72" rx="18" fill="#fff5df" stroke="#e5ca8f"/><text x="82" y="35" fill="#8c610b">SHOW TARGET</text><text x="82" y="55" fill="#8c610b">+ CONFIRM</text></g><g transform="translate(720 236)"><rect width="165" height="72" rx="18" fill="#e9f4ed" stroke="#a6cbb4"/><text x="82" y="35" fill="#2d7a4c">GUARDED</text><text x="82" y="55" fill="#2d7a4c">EXECUTION</text></g><g transform="translate(945 236)"><rect width="135" height="72" rx="18" fill="#17364c"/><text x="67" y="44" fill="white">VERIFY</text></g></g>
  <g fill="none" stroke="#8095a2" stroke-width="4"><path d="M197 186h49"/><path d="M416 177C453 177 449 118 481 118"/><path d="M416 195C453 195 449 272 481 272"/><path d="M652 272h64"/><path d="M887 272h54"/><path d="M1012 312v54H332V226"/></g>
  <g fill="#5f7180" font-size="12"><text x="429" y="112">low confidence / invalid</text><text x="429" y="257">quality + margin pass</text><text x="661" y="259">explicit confirm</text><text x="868" y="259">pass guards</text><text x="656" y="389">success, retry, or fault recovery</text></g>
  <rect x="719" y="90" width="361" height="82" rx="16" fill="#fdeaea" stroke="#e8c0c0"/><text x="741" y="122" fill="#9e3737" font-size="14" font-weight="850">GLOBAL TRANSITION</text><text x="741" y="150" fill="#713535" font-size="14">E-stop, watchdog, stale image, or xArm fault → STOP</text></g>
</svg>
