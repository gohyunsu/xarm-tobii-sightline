<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc"><title id="title">The last-three-centimeters decision window</title><desc id="desc">A concrete sequence showing overhead visibility, self-occlusion near contact, missing side-view inspection, and selective auxiliary-view presentation.</desc><style>.t{font-family:Inter,Arial,sans-serif;fill:#13283f}.h{font-size:20px;font-weight:850}.m{font-size:14px;fill:#5e6d7b}.panel{fill:#fff;stroke:#d7e0e2;stroke-width:2}.view{fill:#e8eff0;stroke:#789097;stroke-width:2}.arm{stroke:#087e8b;stroke-width:19;stroke-linecap:round}.risk{fill:#fae7e1;stroke:#d85f45;stroke-width:3}</style><rect width="1200" height="670" fill="#f8fbfb"/><text class="t" x="600" y="45" text-anchor="middle" font-size="25" font-weight="900">The decision window: why the last 3 cm are different</text>
<g transform="translate(35 90)"><rect class="panel" width="350" height="500" rx="22"/><text class="t h" x="175" y="42" text-anchor="middle">A · Early approach</text><rect class="view" x="35" y="75" width="280" height="210" rx="10"/><rect x="145" y="165" width="65" height="55" rx="7" fill="#fff2cf" stroke="#9a6900" stroke-width="3"/><path class="arm" d="M60 105L115 130L150 150"/><text class="t m" x="175" y="320" text-anchor="middle">Overhead view is sufficient.</text><text class="t m" x="175" y="350" text-anchor="middle">Target centroid and path are visible.</text><rect x="60" y="395" width="230" height="60" rx="12" fill="#dff2f2"/><text class="t" x="175" y="431" text-anchor="middle" font-size="16" font-weight="800">No assistance</text></g>
<g transform="translate(425 90)"><rect class="panel" width="350" height="500" rx="22"/><text class="t h" x="175" y="42" text-anchor="middle">B · Pre-contact occlusion</text><rect class="view" x="35" y="75" width="280" height="210" rx="10"/><rect x="145" y="165" width="65" height="55" rx="7" fill="#fff2cf" stroke="#9a6900" stroke-width="3"/><path class="arm" d="M60 105L125 135L175 175"/><rect class="risk" x="135" y="155" width="90" height="78" rx="10" opacity=".82"/><text class="t m" x="175" y="320" text-anchor="middle">Gripper covers the contact edge.</text><text class="t m" x="175" y="350" text-anchor="middle">Projected time-to-contact is short.</text><rect x="60" y="395" width="230" height="60" rx="12" fill="#fae7e1"/><text class="t" x="175" y="431" text-anchor="middle" font-size="16" font-weight="800">Geometry risk rises</text></g>
<g transform="translate(815 90)"><rect width="350" height="500" rx="22" fill="#eef9f8" stroke="#087e8b" stroke-width="4"/><text class="t h" x="175" y="42" text-anchor="middle">C · Selective evidence</text><rect class="view" x="25" y="75" width="200" height="210" rx="10"/><rect x="95" y="165" width="65" height="55" rx="7" fill="#fff2cf" stroke="#9a6900" stroke-width="3"/><path class="arm" d="M45 105L100 140L128 175"/><rect x="235" y="135" width="100" height="110" rx="10" fill="#dff2f2" stroke="#087e8b" stroke-width="4"/><line x1="250" y1="215" x2="320" y2="175" stroke="#d85f45" stroke-width="4"/><text class="t m" x="175" y="320" text-anchor="middle">Critical side-view AOI was not inspected.</text><text class="t m" x="175" y="350" text-anchor="middle">The side panel expands—nothing moves.</text><rect x="45" y="395" width="260" height="60" rx="12" fill="#dff2f2"/><text class="t" x="175" y="431" text-anchor="middle" font-size="16" font-weight="800">Operator decides explicitly</text></g>
<text class="t m" x="600" y="635" text-anchor="middle">Sightline intervenes only when physical risk and missing visual evidence overlap.</text></svg>
