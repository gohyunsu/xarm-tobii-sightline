<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Implementation and adaptation ladder</title><desc id="desc">Four increasingly demanding implementation stages from a classical safety-first MVP to action-level gaze conditioning.</desc>
  <rect width="1120" height="520" rx="28" fill="#fbfcfc"/><g font-family="system-ui"><text x="48" y="52" fill="#5f7180" font-size="16" font-weight="800" letter-spacing="2">EARN COMPLEXITY ONE ABLATION AT A TIME</text>
  <g transform="translate(54 338)"><rect width="238" height="112" rx="18" fill="#e8f4ec" stroke="#9ac9ac"/><text x="20" y="34" fill="#2d7a4c" font-size="14" font-weight="850">L0 · WORKING MVP</text><text x="20" y="67" fill="#17364c" font-size="19" font-weight="800">ground → guarded skill</text><text x="20" y="93" fill="#536a78" font-size="13">No VLA claim; validates rig.</text></g>
  <g transform="translate(310 258)"><rect width="238" height="192" rx="18" fill="#e1f2f2" stroke="#8fc7c9"/><text x="20" y="34" fill="#087e8b" font-size="14" font-weight="850">L1 · FROZEN VLA</text><text x="20" y="67" fill="#17364c" font-size="19" font-weight="800">visual gaze prompt</text><text x="20" y="97" fill="#536a78" font-size="13">Render mask/heatmap into image.</text><text x="20" y="123" fill="#536a78" font-size="13">No robot-specific training.</text><text x="20" y="164" fill="#087e8b" font-size="13" font-weight="800">Hackathon target</text></g>
  <g transform="translate(566 170)"><rect width="238" height="280" rx="18" fill="#edf1f6" stroke="#b4c2ce"/><text x="20" y="34" fill="#17364c" font-size="14" font-weight="850">L2 · xARM ADAPTATION</text><text x="20" y="67" fill="#17364c" font-size="19" font-weight="800">LoRA or OFT</text><text x="20" y="101" fill="#536a78" font-size="13">Train on real xArm episodes.</text><text x="20" y="127" fill="#536a78" font-size="13">Keep held-out objects/layouts.</text><text x="20" y="153" fill="#536a78" font-size="13">Compare with L1 and narrow</text><text x="20" y="179" fill="#536a78" font-size="13">imitation-learning baseline.</text><text x="20" y="223" fill="#8b610a" font-size="13" font-weight="800">Proceed only if data + GPU pass</text></g>
  <g transform="translate(822 82)"><rect width="238" height="368" rx="18" fill="#fff0e9" stroke="#e0aa9b"/><text x="20" y="34" fill="#ba4d35" font-size="14" font-weight="850">L3 · RESEARCH STRETCH</text><text x="20" y="67" fill="#17364c" font-size="19" font-weight="800">action-level conditioning</text><text x="20" y="103" fill="#536a78" font-size="13">Inject spatial gaze features into</text><text x="20" y="129" fill="#536a78" font-size="13">the action head; test whether</text><text x="20" y="155" fill="#536a78" font-size="13">prompting loses intent during</text><text x="20" y="181" fill="#536a78" font-size="13">long rollouts.</text><line x1="20" y1="211" x2="218" y2="211" stroke="#e0c4bb"/><text x="20" y="242" fill="#a43e32" font-size="13">Nearest overlap: Gaze2Act.</text><text x="20" y="268" fill="#a43e32" font-size="13">Requires a distinct uncertainty</text><text x="20" y="294" fill="#a43e32" font-size="13">or adaptation contribution.</text><text x="20" y="338" fill="#ba4d35" font-size="13" font-weight="800">Not required for a valid demo</text></g>
  <path d="M292 393h14M548 351h14M804 307h14" stroke="#7f96a3" stroke-width="4"/></g>
</svg>
