<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">xArm과 Tobii 실험 장치 배치</title><desc id="desc">작업 셀에는 xArm, overhead, side, wrist 카메라와 물리 장벽이 있고, 운영자는 떨어진 모니터와 아래쪽 Tobii를 사용한다.</desc>
<defs><style>.t{font-family:Pretendard,'Noto Sans KR',sans-serif;fill:#13283f}.h{font-size:21px;font-weight:850}.m{font-size:14px;fill:#5e6d7b}.line{stroke:#82979f;stroke-width:2;stroke-dasharray:7 6}.cam{fill:#dff2f2;stroke:#087e8b;stroke-width:3}</style></defs><rect width="1200" height="680" fill="#f8fbfb"/>
<text class="t" x="600" y="45" text-anchor="middle" font-size="25" font-weight="900">화면 기반 원격조작으로 장치 역할을 분리한다</text>
<rect x="65" y="105" width="650" height="480" rx="28" fill="#fff" stroke="#d7e0e2" stroke-width="3"/><text class="t h" x="95" y="145">Robot workcell</text><rect x="120" y="185" width="540" height="325" rx="15" fill="#edf1f2" stroke="#aebfc4" stroke-width="2"/><rect x="320" y="275" width="140" height="115" rx="12" fill="#fae7e1" stroke="#d85f45" stroke-width="3"/><text class="t m" x="390" y="335" text-anchor="middle">task zone</text>
<circle cx="215" cy="410" r="54" fill="#13283f"/><path d="M215 410L260 350L320 370L370 305" fill="none" stroke="#087e8b" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/><circle cx="260" cy="350" r="15" fill="#fff"/><circle cx="320" cy="370" r="15" fill="#fff"/><rect x="356" y="287" width="42" height="25" rx="6" fill="#13283f"/><text class="t h" x="195" y="485" text-anchor="middle">xArm</text>
<g transform="translate(335 165)"><rect class="cam" width="110" height="58" rx="10"/><circle cx="55" cy="29" r="15" fill="#087e8b"/><text class="t m" x="55" y="-10" text-anchor="middle">overhead</text></g><g transform="translate(565 300)"><rect class="cam" width="78" height="48" rx="9"/><circle cx="39" cy="24" r="12" fill="#087e8b"/><text class="t m" x="39" y="72" text-anchor="middle">side</text></g><g transform="translate(360 255)"><rect class="cam" width="58" height="36" rx="8"/><circle cx="29" cy="18" r="9" fill="#087e8b"/><text class="t m" x="29" y="-9" text-anchor="middle">wrist</text></g>
<rect x="735" y="95" width="12" height="500" fill="#d85f45"/><text class="t m" x="760" y="575">physical barrier</text>
<rect x="825" y="155" width="310" height="210" rx="14" fill="#13283f"/><rect x="845" y="175" width="270" height="170" rx="8" fill="#dff2f2"/><rect x="925" y="370" width="110" height="13" rx="6" fill="#087e8b"/><text class="t h" x="980" y="420" text-anchor="middle">Tobii under monitor</text><rect x="870" y="455" width="220" height="70" rx="15" fill="#fff" stroke="#d7e0e2" stroke-width="2"/><text class="t m" x="980" y="485" text-anchor="middle">SpaceMouse / gamepad</text><text class="t m" x="980" y="508" text-anchor="middle">+ physical E-stop</text>
<line class="line" x1="445" y1="194" x2="845" y2="210"/><line class="line" x1="643" y1="325" x2="845" y2="260"/><line class="line" x1="418" y1="270" x2="845" y2="310"/>
<text class="t m" x="600" y="640" text-anchor="middle">Tobii Eye Tracker 5를 전제로 하면 실제 작업대를 직접 보는 3D gaze가 아니라 모니터 안의 view/AOI만 측정한다.</text>
</svg>
