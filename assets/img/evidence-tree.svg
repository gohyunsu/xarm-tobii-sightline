<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 570" role="img" aria-labelledby="title desc">
  <title id="title">GazePick evidence tree</title><desc id="desc">A hierarchy separates referent quality, interaction cost, robot mechanics, and model value before combining them into end-to-end success.</desc>
  <defs><linearGradient id="root" x2="1"><stop stop-color="#10263a"/><stop offset="1" stop-color="#0b5e64"/></linearGradient><filter id="s"><feDropShadow dy="8" stdDeviation="10" flood-color="#10263a" flood-opacity=".1"/></filter></defs><rect width="1180" height="570" rx="30" fill="#f8faf8"/>
  <g font-family="system-ui"><text x="52" y="54" fill="#607381" font-size="16" font-weight="800" letter-spacing="2.4">DO NOT COMPRESS THE RESULT INTO ONE SUCCESS PERCENTAGE</text>
  <rect x="400" y="92" width="380" height="82" rx="22" fill="url(#root)" filter="url(#s)"/><text x="590" y="126" text-anchor="middle" fill="#9be2dc" font-size="13" font-weight="850">END-TO-END OUTCOME</text><text x="590" y="154" text-anchor="middle" fill="white" font-size="22" font-weight="850">correct referent × successful mechanics</text>
  <path d="M590 176v50M155 226h870M155 226v38M445 226v38M735 226v38M1025 226v38" fill="none" stroke="#a8bcbd" stroke-width="3"/>
  <g transform="translate(42 264)"><rect width="226" height="230" rx="21" fill="#e4f3f0" stroke="#b7d9d4" filter="url(#s)"/><text x="22" y="36" fill="#087b82" font-size="13" font-weight="850">A · REFERENT QUALITY</text><text x="22" y="78" fill="#10263a" font-size="19" font-weight="800">Did it choose the</text><text x="22" y="102" fill="#10263a" font-size="19" font-weight="800">intended object?</text><line x1="22" y1="126" x2="204" y2="126" stroke="#bad7d3"/><text x="22" y="155" fill="#607381" font-size="14">top-1 accuracy</text><text x="22" y="179" fill="#607381" font-size="14">wrong-object pick</text><text x="22" y="203" fill="#607381" font-size="14">Brier · NLL · ECE</text></g>
  <g transform="translate(332 264)"><rect width="226" height="230" rx="21" fill="#fff3dc" stroke="#e7d19e" filter="url(#s)"/><text x="22" y="36" fill="#96640a" font-size="13" font-weight="850">B · SELECTIVITY + COST</text><text x="22" y="78" fill="#10263a" font-size="19" font-weight="800">Did it know when</text><text x="22" y="102" fill="#10263a" font-size="19" font-weight="800">to ask?</text><line x1="22" y1="126" x2="204" y2="126" stroke="#e5cf9e"/><text x="22" y="155" fill="#607381" font-size="14">coverage · selective risk</text><text x="22" y="179" fill="#607381" font-size="14">referent time</text><text x="22" y="203" fill="#607381" font-size="14">clarify · confirm · click</text></g>
  <g transform="translate(622 264)"><rect width="226" height="230" rx="21" fill="#edf0f2" stroke="#c8d3d7" filter="url(#s)"/><text x="22" y="36" fill="#193b4f" font-size="13" font-weight="850">C · ROBOT MECHANICS</text><text x="22" y="78" fill="#10263a" font-size="19" font-weight="800">Did xArm complete</text><text x="22" y="102" fill="#10263a" font-size="19" font-weight="800">the physical task?</text><line x1="22" y1="126" x2="204" y2="126" stroke="#cad5d8"/><text x="22" y="155" fill="#607381" font-size="14">pick · retention</text><text x="22" y="179" fill="#607381" font-size="14">transport · place</text><text x="22" y="203" fill="#607381" font-size="14">fault · intervention · time</text></g>
  <g transform="translate(912 264)"><rect width="226" height="230" rx="21" fill="#faeae4" stroke="#e8c5b9" filter="url(#s)"/><text x="22" y="36" fill="#b64d36" font-size="13" font-weight="850">D · MODEL VALUE</text><text x="22" y="78" fill="#10263a" font-size="19" font-weight="800">Which component</text><text x="22" y="102" fill="#10263a" font-size="19" font-weight="800">earned complexity?</text><line x1="22" y1="126" x2="204" y2="126" stroke="#e7c5bb"/><text x="22" y="155" fill="#607381" font-size="14">R2 − R1 fusion value</text><text x="22" y="179" fill="#607381" font-size="14">P1 − P0 VLA value</text><text x="22" y="203" fill="#607381" font-size="14">P2 − P1 tuning value</text></g>
  <text x="590" y="538" text-anchor="middle" fill="#607381" font-size="14">A model can succeed mechanically on the wrong object; a safe abstention can be correct without completing the task.</text></g>
</svg>
