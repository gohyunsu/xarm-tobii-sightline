<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc">
  <title id="title">July to November project plan</title><desc id="desc">Five phases move from specification and rig bring-up to data collection, adaptation, evaluation, and demonstration.</desc>
  <rect width="1120" height="430" rx="28" fill="#fbfcfc"/><g font-family="system-ui"><text x="50" y="50" fill="#5f7180" font-size="16" font-weight="800" letter-spacing="2">BUILD THE EVIDENCE CHAIN, NOT ONLY THE DEMO</text><line x1="90" y1="194" x2="1030" y2="194" stroke="#b3c2ca" stroke-width="8" stroke-linecap="round"/>
  <g text-anchor="middle"><circle cx="118" cy="194" r="19" fill="#087e8b"/><text x="118" y="151" fill="#087e8b" font-size="15" font-weight="850">JULY</text><text x="118" y="239" fill="#17364c" font-size="15" font-weight="800">freeze task</text><text x="118" y="264" fill="#536a78" font-size="13">inventory · safety</text>
  <circle cx="340" cy="194" r="19" fill="#087e8b"/><text x="340" y="151" fill="#087e8b" font-size="15" font-weight="850">AUGUST</text><text x="340" y="239" fill="#17364c" font-size="15" font-weight="800">bring up rig</text><text x="340" y="264" fill="#536a78" font-size="13">B0/B1 · pilot</text>
  <circle cx="562" cy="194" r="19" fill="#d6a126"/><text x="562" y="151" fill="#936707" font-size="15" font-weight="850">SEPTEMBER</text><text x="562" y="239" fill="#17364c" font-size="15" font-weight="800">collect episodes</text><text x="562" y="264" fill="#536a78" font-size="13">B2 · data QA</text>
  <circle cx="784" cy="194" r="19" fill="#d85f45"/><text x="784" y="151" fill="#b94d36" font-size="15" font-weight="850">OCTOBER</text><text x="784" y="239" fill="#17364c" font-size="15" font-weight="800">adapt + evaluate</text><text x="784" y="264" fill="#536a78" font-size="13">B3 · held-out tests</text>
  <circle cx="1006" cy="194" r="19" fill="#2d7a4c"/><text x="1006" y="151" fill="#2d7a4c" font-size="15" font-weight="850">NOVEMBER</text><text x="1006" y="239" fill="#17364c" font-size="15" font-weight="800">demo + report</text><text x="1006" y="264" fill="#536a78" font-size="13">rehearse failures</text></g>
  <rect x="74" y="320" width="972" height="56" rx="15" fill="#17364c"/><text x="560" y="355" fill="white" text-anchor="middle" font-size="16" font-weight="800">Every phase ends with a go / revise / stop gate and an archived evidence bundle.</text></g>
</svg>
