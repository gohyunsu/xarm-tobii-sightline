<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Evidence ladder for interpreting gaze</title><desc id="desc">The diagram separates observed gaze samples from AOI overlap, inspection evidence, attention, understanding, intent, and approval.</desc><style>.t{font-family:Inter,Arial,sans-serif;fill:#13283f}.m{font-size:14px;fill:#5e6d7b}.ok{fill:#dff2f2;stroke:#087e8b;stroke-width:3}.no{fill:#fae7e1;stroke:#d85f45;stroke-width:3}.step{fill:#fff;stroke:#d7e0e2;stroke-width:2}</style><rect width="1200" height="600" fill="#f8fbfb"/><text class="t" x="600" y="45" text-anchor="middle" font-size="25" font-weight="900">What a gaze sample can—and cannot—justify</text>
<g transform="translate(65 105)"><rect class="ok" width="250" height="115" rx="18"/><text class="t" x="125" y="42" text-anchor="middle" font-size="19" font-weight="850">1 · Observed</text><text class="t m" x="125" y="72" text-anchor="middle">valid screen gaze sample</text><text class="t m" x="125" y="96" text-anchor="middle">with timestamp + uncertainty</text></g>
<g transform="translate(365 105)"><rect class="ok" width="250" height="115" rx="18"/><text class="t" x="125" y="42" text-anchor="middle" font-size="19" font-weight="850">2 · Computed</text><text class="t m" x="125" y="72" text-anchor="middle">overlap with a versioned</text><text class="t m" x="125" y="96" text-anchor="middle">task-critical AOI</text></g>
<g transform="translate(665 105)"><rect class="ok" width="250" height="115" rx="18"/><text class="t" x="125" y="42" text-anchor="middle" font-size="19" font-weight="850">3 · Permitted claim</text><text class="t m" x="125" y="72" text-anchor="middle">limited evidence of recent</text><text class="t m" x="125" y="96" text-anchor="middle">visual inspection</text></g>
<path d="M315 162H355M615 162H655" stroke="#087e8b" stroke-width="4"/><path d="M355 162l-12-7v14zM655 162l-12-7v14z" fill="#087e8b"/>
<line x1="940" y1="85" x2="940" y2="500" stroke="#d85f45" stroke-width="5" stroke-dasharray="10 8"/><text class="t" x="940" y="535" text-anchor="middle" font-size="16" font-weight="900" fill="#a63737">INFERENCE BOUNDARY</text>
<g transform="translate(975 85)"><rect class="no" width="190" height="80" rx="16"/><text class="t" x="95" y="35" text-anchor="middle" font-size="17" font-weight="850">Attention</text><text class="t m" x="95" y="60" text-anchor="middle">not established</text></g><g transform="translate(975 180)"><rect class="no" width="190" height="80" rx="16"/><text class="t" x="95" y="35" text-anchor="middle" font-size="17" font-weight="850">Understanding</text><text class="t m" x="95" y="60" text-anchor="middle">not established</text></g><g transform="translate(975 275)"><rect class="no" width="190" height="80" rx="16"/><text class="t" x="95" y="35" text-anchor="middle" font-size="17" font-weight="850">Intent</text><text class="t m" x="95" y="60" text-anchor="middle">not established</text></g><g transform="translate(975 370)"><rect class="no" width="190" height="80" rx="16"/><text class="t" x="95" y="35" text-anchor="middle" font-size="17" font-weight="850">Approval / safety</text><text class="t m" x="95" y="60" text-anchor="middle">never inferred</text></g>
<rect class="step" x="65" y="310" width="850" height="150" rx="22"/><text class="t" x="90" y="350" font-size="19" font-weight="850">Operational rule</text><text class="t m" x="90" y="385">Invalid gaze is missing data, not “the operator did not look.” AOI dilation and probabilistic overlap test</text><text class="t m" x="90" y="413">whether the narrow inspection claim survives plausible calibration error. Motion authority remains elsewhere.</text></svg>
