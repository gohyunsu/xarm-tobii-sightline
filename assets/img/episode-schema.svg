<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 540" role="img" aria-labelledby="title desc">
  <title id="title">GazePick episode schema</title><desc id="desc">Synchronized streams join into one episode with training labels, quality information, and outcomes.</desc>
  <rect width="1120" height="540" rx="28" fill="#f9fbfb"/><g font-family="system-ui"><text x="50" y="50" fill="#5f7180" font-size="16" font-weight="800" letter-spacing="2">ONE EPISODE, SIX SYNCHRONIZED STREAMS</text>
  <g fill="#fff" stroke="#cbd8db"><rect x="48" y="92" width="220" height="66" rx="15"/><rect x="48" y="176" width="220" height="66" rx="15"/><rect x="48" y="260" width="220" height="66" rx="15"/><rect x="48" y="344" width="220" height="66" rx="15"/><rect x="48" y="428" width="220" height="66" rx="15"/></g>
  <g fill="#17364c" font-size="17" font-weight="800"><text x="70" y="132">Tobii gaze + validity</text><text x="70" y="216">RGB(/D) frames + masks</text><text x="70" y="300">audio + transcript</text><text x="70" y="384">xArm state + actions</text><text x="70" y="468">UI + confirmations</text></g>
  <path d="M270 125H394M270 209H394M270 293H394M270 377H394M270 461H394" stroke="#8095a2" stroke-width="3"/>
  <rect x="398" y="120" width="280" height="330" rx="24" fill="#17364c"/><text x="425" y="159" fill="#80d0d3" font-size="14" font-weight="850">GAZEPICK EPISODE</text><text x="425" y="197" fill="white" font-size="21" font-weight="800">identity + split group</text><text x="425" y="231" fill="white" font-size="21" font-weight="800">clock map + residuals</text><text x="425" y="265" fill="white" font-size="21" font-weight="800">gaze distribution</text><text x="425" y="299" fill="white" font-size="21" font-weight="800">candidate posteriors</text><text x="425" y="333" fill="white" font-size="21" font-weight="800">instruction + destination</text><text x="425" y="367" fill="white" font-size="21" font-weight="800">action chunks + outcomes</text><text x="425" y="415" fill="#f1c66f" font-size="14">all calibrations and models versioned</text>
  <path d="M680 203h78M680 365h78" stroke="#8095a2" stroke-width="3"/>
  <rect x="762" y="105" width="310" height="194" rx="22" fill="#e2f3f3" stroke="#94c9cc"/><text x="788" y="142" fill="#087e8b" font-size="14" font-weight="850">TRAINING VIEW</text><text x="788" y="178" fill="#17364c" font-size="18" font-weight="800">observation → action chunk</text><text x="788" y="210" fill="#4f6574" font-size="14">image, proprioception, language,</text><text x="788" y="234" fill="#4f6574" font-size="14">gaze representation, action, mask</text><text x="788" y="270" fill="#087e8b" font-size="13" font-weight="750">RLDS or tested PyTorch wrapper</text>
  <rect x="762" y="323" width="310" height="171" rx="22" fill="#fff0e9" stroke="#e0ad9f"/><text x="788" y="360" fill="#ba4d35" font-size="14" font-weight="850">AUDIT VIEW</text><text x="788" y="398" fill="#17364c" font-size="18" font-weight="800">quality → decision → outcome</text><text x="788" y="430" fill="#4f6574" font-size="14">wrong object, pick, place, latency,</text><text x="788" y="454" fill="#4f6574" font-size="14">abstention, calibration, fault state</text></g>
</svg>
