<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 590" role="img" aria-labelledby="title desc">
  <title id="title">Four coordinate layers in GazePick</title><desc id="desc">Tobii display coordinates are mapped through the rendered video rectangle into camera image coordinates, integrated over object masks, and only then associated with robot world poses.</desc>
  <defs><linearGradient id="screen" x2="1" y2="1"><stop stop-color="#10263a"/><stop offset="1" stop-color="#0b5e64"/></linearGradient><filter id="s"><feDropShadow dy="10" stdDeviation="12" flood-color="#10263a" flood-opacity=".12"/></filter></defs><rect width="1180" height="590" rx="30" fill="#f8faf8"/>
  <g font-family="system-ui"><text x="52" y="54" fill="#607381" font-size="16" font-weight="800" letter-spacing="2.4">ONE LOOK PASSES THROUGH FOUR DIFFERENT SPACES</text>
  <g transform="translate(48 96)"><rect width="240" height="390" rx="24" fill="url(#screen)" filter="url(#s)"/><text x="22" y="38" fill="#8dddda" font-size="14" font-weight="850">1 · DISPLAY SPACE</text><rect x="22" y="66" width="196" height="134" rx="12" fill="#eaf0ef"/><rect x="36" y="82" width="168" height="101" rx="7" fill="#ccd9d8"/><circle cx="146" cy="132" r="8" fill="#eda61e"/><line x1="146" y1="92" x2="146" y2="172" stroke="#eda61e" stroke-width="2"/><line x1="106" y1="132" x2="186" y2="132" stroke="#eda61e" stroke-width="2"/><text x="22" y="240" fill="white" font-size="20" font-weight="800">What Tobii measures</text><text x="22" y="276" fill="#bfd3d7" font-size="14">monitor ID · display pixels</text><text x="22" y="300" fill="#bfd3d7" font-size="14">per-eye validity · time</text><text x="22" y="342" fill="#f1c46d" font-size="13">The gaze point is not yet</text><text x="22" y="364" fill="#f1c46d" font-size="13">a camera pixel or object.</text></g>
  <g transform="translate(326 96)"><rect width="240" height="390" rx="24" fill="white" stroke="#d2dddc" filter="url(#s)"/><text x="22" y="38" fill="#087b82" font-size="14" font-weight="850">2 · RENDERED VIDEO</text><rect x="22" y="66" width="196" height="134" rx="12" fill="#10263a"/><rect x="43" y="66" width="154" height="134" fill="#dfe8e6"/><circle cx="139" cy="132" r="8" fill="#eda61e"/><path d="M43 214h154" stroke="#df684a" stroke-width="4"/><text x="22" y="240" fill="#10263a" font-size="20" font-weight="800">Remove UI geometry</text><text x="22" y="276" fill="#607381" font-size="14">CSS rectangle · DPI scale</text><text x="22" y="300" fill="#607381" font-size="14">letterbox · fullscreen state</text><text x="22" y="342" fill="#a9443e" font-size="13">Ignoring the black bars moves</text><text x="22" y="364" fill="#a9443e" font-size="13">every inferred target.</text></g>
  <g transform="translate(604 96)"><rect width="240" height="390" rx="24" fill="#e6f4f1" stroke="#b9d9d5" filter="url(#s)"/><text x="22" y="38" fill="#087b82" font-size="14" font-weight="850">3 · CAMERA + MASKS</text><rect x="22" y="66" width="196" height="134" rx="12" fill="#f9fbfa"/><g transform="translate(37 105)"><rect width="46" height="57" rx="9" fill="#7fa7ae"/><rect x="58" width="46" height="57" rx="9" fill="#82aab1"/><rect x="116" width="46" height="57" rx="9" fill="#7fa6ad"/><ellipse cx="82" cy="27" rx="59" ry="39" fill="#f5c557" opacity=".36"/><circle cx="82" cy="27" r="7" fill="#dc930d"/></g><text x="22" y="240" fill="#10263a" font-size="20" font-weight="800">Integrate probability</text><text x="22" y="276" fill="#607381" font-size="14">image (u, v) · gaze covariance</text><text x="22" y="300" fill="#607381" font-size="14">candidate object masks</text><text x="22" y="342" fill="#087b82" font-size="13">Output: probability over IDs,</text><text x="22" y="364" fill="#087b82" font-size="13">not a raw cursor position.</text></g>
  <g transform="translate(882 96)"><rect width="250" height="390" rx="24" fill="#edf0f2" stroke="#c8d2d7" filter="url(#s)"/><text x="22" y="38" fill="#193b4f" font-size="14" font-weight="850">4 · ROBOT WORLD</text><path d="M53 190q8-83 61-92l21 23q-41 23-36 84M99 205l-29 38M99 205l38 38" fill="none" stroke="#193b4f" stroke-width="15" stroke-linecap="round"/><rect x="157" y="154" width="52" height="42" rx="8" fill="#087b82"/><path d="M139 176h18" stroke="#df684a" stroke-width="4" stroke-dasharray="6 5"/><text x="22" y="260" fill="#10263a" font-size="20" font-weight="800">Use the selected ID</text><text x="22" y="296" fill="#607381" font-size="14">camera calibration · object pose</text><text x="22" y="320" fill="#607381" font-size="14">robot base · TCP · grasp frame</text><text x="22" y="362" fill="#a9443e" font-size="13">Gaze never bypasses motion</text><text x="22" y="384" fill="#a9443e" font-size="13">planning or execution guards.</text></g>
  <g fill="none" stroke="#8aa2aa" stroke-width="4"><path d="M290 292h32"/><path d="M568 292h32"/><path d="M846 292h32"/></g><g fill="#8aa2aa"><path d="M316 282l12 10-12 10"/><path d="M594 282l12 10-12 10"/><path d="M872 282l12 10-12 10"/></g>
  <rect x="170" y="520" width="840" height="40" rx="13" fill="#10263a"/><text x="590" y="546" text-anchor="middle" fill="white" font-size="14" font-weight="750">Log every transform and version; otherwise the same gaze sample cannot be replayed or audited.</text></g>
</svg>
