<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Confirmatory analysis model</title><desc id="desc">Condition, occlusion, task, expertise, and gaze quality predict outcomes with participant and scene random effects.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#087e8b"/></marker><style>.t{font-family:Inter,Arial,sans-serif;fill:#13283f}.m{font-size:14px;fill:#5e6d7b}.b{fill:#fff;stroke:#d7e0e2;stroke-width:2}.x{fill:#dff2f2;stroke:#087e8b;stroke-width:3}.y{fill:#fae7e1;stroke:#d85f45;stroke-width:3}.l{stroke:#087e8b;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1200" height="620" fill="#f8fbfb"/><text class="t" x="600" y="45" text-anchor="middle" font-size="25" font-weight="900">The confirmatory model generalizes across people and scenes</text>
<g transform="translate(55 105)"><rect class="x" width="290" height="300" rx="22"/><text class="t" x="145" y="42" text-anchor="middle" font-size="20" font-weight="900">Fixed effects</text><text class="t m" x="35" y="90">• interface condition C0–C3</text><text class="t m" x="35" y="125">• occlusion: low / high</text><text class="t m" x="35" y="160">• task: pick / stack / insert</text><text class="t m" x="35" y="195">• expertise and trial order</text><text class="t m" x="35" y="230">• condition × occlusion</text><text class="t m" x="35" y="265">• tracking quality sensitivity</text></g>
<g transform="translate(455 115)"><rect class="b" width="290" height="125" rx="22"/><text class="t" x="145" y="42" text-anchor="middle" font-size="20" font-weight="900">Random effects</text><text class="t m" x="145" y="78" text-anchor="middle">participant · scene / layout</text><text class="t m" x="145" y="103" text-anchor="middle">condition slope when supported</text></g><g transform="translate(455 285)"><rect class="b" width="290" height="125" rx="22"/><text class="t" x="145" y="42" text-anchor="middle" font-size="20" font-weight="900">Planned contrast</text><text class="t" x="145" y="83" text-anchor="middle" font-size="26" font-weight="950" fill="#a63737">C3 − C2</text><text class="t m" x="145" y="108" text-anchor="middle">gaze incremental value</text></g>
<g transform="translate(855 85)"><rect class="y" width="290" height="360" rx="22"/><text class="t" x="145" y="42" text-anchor="middle" font-size="20" font-weight="900">Outcome families</text><text class="t m" x="35" y="90">Primary</text><text class="t" x="35" y="120" font-size="15">contact · drop · deviation</text><text class="t" x="35" y="148" font-size="15">task success</text><text class="t m" x="35" y="195">Secondary</text><text class="t" x="35" y="225" font-size="15">time · path · jerk</text><text class="t" x="35" y="253" font-size="15">view / gaze transitions</text><text class="t m" x="35" y="300">Cost / quality</text><text class="t" x="35" y="330" font-size="15">TLX · override · churn</text></g>
<line class="l" x1="345" y1="255" x2="445" y2="210"/><line class="l" x1="745" y1="210" x2="845" y2="210"/><line class="l" x1="745" y1="345" x2="845" y2="300"/>
<rect x="250" y="505" width="700" height="70" rx="18" fill="#fff2cf" stroke="#9a6900" stroke-width="2"/><text class="t" x="600" y="535" text-anchor="middle" font-size="16" font-weight="850">No arbitrary N: pilot variance → simulation-based power for H3</text><text class="t m" x="600" y="560" text-anchor="middle">Freeze exclusions, primary outcomes, and contrast before confirmatory collection.</text></svg>
