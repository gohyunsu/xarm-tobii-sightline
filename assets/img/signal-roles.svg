<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc">
  <title id="title">Roles of gaze, language, action policy, and xArm</title><desc id="desc">Four components answer different questions and connect in sequence.</desc>
  <rect width="1120" height="420" rx="28" fill="#f9fbfb"/>
  <g font-family="system-ui"><text x="54" y="57" fill="#5f7180" font-size="16" font-weight="800" letter-spacing="2">DO NOT COLLAPSE THE ROLES</text>
  <g transform="translate(45 92)"><rect width="232" height="250" rx="22" fill="#e1f2f2" stroke="#8cc5c8"/><circle cx="42" cy="44" r="22" fill="#087e8b"/><text x="35" y="51" fill="white" font-size="20" font-weight="800">1</text><text x="25" y="98" fill="#087e8b" font-size="15" font-weight="850">TOBII GAZE</text><text x="25" y="136" fill="#17364c" font-size="25" font-weight="800">Which one?</text><text x="25" y="174" fill="#4f6675" font-size="15">A noisy 2D distribution</text><text x="25" y="198" fill="#4f6675" font-size="15">over the displayed scene.</text><text x="25" y="229" fill="#a33e36" font-size="13" font-weight="750">Not a motion command.</text></g>
  <g transform="translate(310 92)"><rect width="232" height="250" rx="22" fill="#fff0e9" stroke="#e4ad9f"/><circle cx="42" cy="44" r="22" fill="#d85f45"/><text x="35" y="51" fill="white" font-size="20" font-weight="800">2</text><text x="25" y="98" fill="#b84e37" font-size="15" font-weight="850">LANGUAGE</text><text x="25" y="136" fill="#17364c" font-size="25" font-weight="800">Do what?</text><text x="25" y="174" fill="#4f6675" font-size="15">The skill, destination, and</text><text x="25" y="198" fill="#4f6675" font-size="15">constraints of the task.</text><text x="25" y="229" fill="#a33e36" font-size="13" font-weight="750">May still be underspecified.</text></g>
  <g transform="translate(575 92)"><rect width="232" height="250" rx="22" fill="#edf1f6" stroke="#afbecd"/><circle cx="42" cy="44" r="22" fill="#17364c"/><text x="35" y="51" fill="white" font-size="20" font-weight="800">3</text><text x="25" y="98" fill="#17364c" font-size="15" font-weight="850">ACTION POLICY</text><text x="25" y="136" fill="#17364c" font-size="25" font-weight="800">How to act?</text><text x="25" y="174" fill="#4f6675" font-size="15">Maps accepted target + task</text><text x="25" y="198" fill="#4f6675" font-size="15">to a motion proposal.</text><text x="25" y="229" fill="#a33e36" font-size="13" font-weight="750">Proposal, not authorization.</text></g>
  <g transform="translate(840 92)"><rect width="232" height="250" rx="22" fill="#e9f4ed" stroke="#9ac9ac"/><circle cx="42" cy="44" r="22" fill="#2d7a4c"/><text x="35" y="51" fill="white" font-size="20" font-weight="800">4</text><text x="25" y="98" fill="#2d7a4c" font-size="15" font-weight="850">xARM GUARD</text><text x="25" y="136" fill="#17364c" font-size="25" font-weight="800">May it move?</text><text x="25" y="174" fill="#4f6675" font-size="15">Checks confirmation, limits,</text><text x="25" y="198" fill="#4f6675" font-size="15">state, path, and faults.</text><text x="25" y="229" fill="#2d7a4c" font-size="13" font-weight="750">Only this layer executes.</text></g>
  <path d="M279 217h27M544 217h27M809 217h27" stroke="#869ba8" stroke-width="4" stroke-linecap="round"/></g>
</svg>
