<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Sightline-xArm dual-loop architecture</title><desc id="desc">Explicit operator input controls the xArm, while gaze and camera data can only affect information presentation.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#087e8b"/></marker><style>.t{font-family:Inter,Arial,sans-serif;fill:#13283f}.h{font-weight:800;font-size:22px}.m{font-size:15px;fill:#5e6d7b}.box{fill:#fff;stroke:#cddadd;stroke-width:2}.line{fill:none;stroke:#087e8b;stroke-width:4;marker-end:url(#a)}.dash{fill:none;stroke:#d85f45;stroke-width:3;stroke-dasharray:9 8}</style></defs>
<rect width="1200" height="650" fill="#f8fbfb"/><text class="t h" x="600" y="48" text-anchor="middle">Two closed loops with one non-negotiable boundary</text>
<rect class="box" x="70" y="110" width="230" height="125" rx="22"/><text class="t h" x="185" y="160" text-anchor="middle">Operator</text><text class="t m" x="185" y="193" text-anchor="middle">SpaceMouse / gamepad</text><text class="t m" x="185" y="216" text-anchor="middle">explicit control input</text>
<rect class="box" x="485" y="110" width="230" height="125" rx="22"/><text class="t h" x="600" y="160" text-anchor="middle">Motion guard</text><text class="t m" x="600" y="193" text-anchor="middle">speed · workspace · E-stop</text><text class="t m" x="600" y="216" text-anchor="middle">ROS 2 / xArm API</text>
<rect class="box" x="900" y="110" width="230" height="125" rx="22"/><text class="t h" x="1015" y="160" text-anchor="middle">xArm</text><text class="t m" x="1015" y="193" text-anchor="middle">TCP pose · joints · gripper</text><text class="t m" x="1015" y="216" text-anchor="middle">physical manipulation</text>
<path class="line" d="M300 172H477"/><path class="line" d="M715 172H892"/><text class="t m" x="388" y="153" text-anchor="middle">robot command</text><text class="t m" x="808" y="153" text-anchor="middle">guarded command</text>
<rect class="box" x="900" y="365" width="230" height="125" rx="22"/><text class="t h" x="1015" y="415" text-anchor="middle">Three cameras</text><text class="t m" x="1015" y="448" text-anchor="middle">overhead · side · wrist</text><text class="t m" x="1015" y="471" text-anchor="middle">video + visibility state</text>
<rect class="box" x="485" y="365" width="230" height="125" rx="22"/><text class="t h" x="600" y="415" text-anchor="middle">Operator display</text><text class="t m" x="600" y="448" text-anchor="middle">main + selective auxiliary view</text><text class="t m" x="600" y="471" text-anchor="middle">all actions remain explicit</text>
<rect class="box" x="70" y="365" width="230" height="125" rx="22"/><text class="t h" x="185" y="415" text-anchor="middle">Tobii</text><text class="t m" x="185" y="448" text-anchor="middle">screen gaze + validity</text><text class="t m" x="185" y="471" text-anchor="middle">inspection evidence only</text>
<path class="line" d="M900 428H723"/><path class="line" d="M485 428H308"/>
<rect x="400" y="535" width="400" height="80" rx="20" fill="#dff2f2" stroke="#9bc9cd" stroke-width="2"/><text class="t h" x="600" y="568" text-anchor="middle">Risk × inspection-deficit assistant</text><text class="t m" x="600" y="596" text-anchor="middle">high risk + missing evidence → present an auxiliary view</text>
<path class="line" d="M185 490V575H392"/><path class="line" d="M1015 490V575H808"/><path class="line" d="M600 535V498"/>
<path class="dash" d="M185 335C330 270 850 270 1015 335"/><text x="600" y="295" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800" fill="#d85f45">FORBIDDEN: gaze alone never moves the robot or a motorized camera</text>
</svg>
