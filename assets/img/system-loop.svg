<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Sightline-xArm 폐루프 구조</title><desc id="desc">사람의 명시적 조작 입력은 xArm으로, 카메라 영상은 화면으로, Tobii 시선은 위험과 미검사 영역을 계산하는 보조 계층으로만 연결된다.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#087e8b"/></marker><style>.t{font-family:Pretendard,'Noto Sans KR',sans-serif;fill:#13283f}.h{font-weight:800;font-size:23px}.m{font-size:16px;fill:#5e6d7b}.box{fill:#fff;stroke:#cddadd;stroke-width:2}.line{fill:none;stroke:#087e8b;stroke-width:4;marker-end:url(#a)}.dash{fill:none;stroke:#d85f45;stroke-width:3;stroke-dasharray:9 8}</style></defs>
<rect width="1200" height="650" fill="#f8fbfb"/>
<text class="t h" x="600" y="48" text-anchor="middle">두 개의 폐루프, 하나의 명확한 경계</text>
<rect class="box" x="70" y="110" width="230" height="125" rx="22"/><text class="t h" x="185" y="160" text-anchor="middle">운영자</text><text class="t m" x="185" y="193" text-anchor="middle">SpaceMouse / gamepad</text><text class="t m" x="185" y="216" text-anchor="middle">명시적 조작 입력</text>
<rect class="box" x="485" y="110" width="230" height="125" rx="22"/><text class="t h" x="600" y="160" text-anchor="middle">안전 제어기</text><text class="t m" x="600" y="193" text-anchor="middle">속도 · workspace · E-stop</text><text class="t m" x="600" y="216" text-anchor="middle">ROS 2 / xArm API</text>
<rect class="box" x="900" y="110" width="230" height="125" rx="22"/><text class="t h" x="1015" y="160" text-anchor="middle">xArm</text><text class="t m" x="1015" y="193" text-anchor="middle">TCP pose · joints · gripper</text><text class="t m" x="1015" y="216" text-anchor="middle">실제 물리 작업</text>
<path class="line" d="M300 172H477"/><path class="line" d="M715 172H892"/>
<text class="t m" x="388" y="153" text-anchor="middle">robot command</text><text class="t m" x="808" y="153" text-anchor="middle">제한된 명령</text>
<rect class="box" x="900" y="365" width="230" height="125" rx="22"/><text class="t h" x="1015" y="415" text-anchor="middle">3개 카메라</text><text class="t m" x="1015" y="448" text-anchor="middle">overhead · side · wrist</text><text class="t m" x="1015" y="471" text-anchor="middle">영상 + 가림 상태</text>
<rect class="box" x="485" y="365" width="230" height="125" rx="22"/><text class="t h" x="600" y="415" text-anchor="middle">조작 화면</text><text class="t m" x="600" y="448" text-anchor="middle">main view + 선택적 보조 view</text><text class="t m" x="600" y="471" text-anchor="middle">모든 로봇 행동은 여기서 확인</text>
<rect class="box" x="70" y="365" width="230" height="125" rx="22"/><text class="t h" x="185" y="415" text-anchor="middle">Tobii</text><text class="t m" x="185" y="448" text-anchor="middle">화면 gaze + validity</text><text class="t m" x="185" y="471" text-anchor="middle">검사 범위 측정</text>
<path class="line" d="M900 428H723"/><path class="line" d="M485 428H308"/>
<rect x="400" y="535" width="400" height="80" rx="20" fill="#dff2f2" stroke="#9bc9cd" stroke-width="2"/><text class="t h" x="600" y="568" text-anchor="middle">Risk × Inspection-deficit assistant</text><text class="t m" x="600" y="596" text-anchor="middle">위험한 순간 + 아직 보지 않은 핵심 영역 → 보조 시점 제시</text>
<path class="line" d="M185 490V575H392"/><path class="line" d="M1015 490V575H808"/><path class="line" d="M600 535V498"/>
<path class="dash" d="M185 335C330 270 850 270 1015 335"/><text x="600" y="295" text-anchor="middle" font-family="Pretendard,'Noto Sans KR',sans-serif" font-size="18" font-weight="800" fill="#d85f45">금지된 연결: gaze만으로 xArm이나 카메라를 움직이지 않음</text>
</svg>
