<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Teleoperation visual failure taxonomy</title><desc id="desc">Three families of visual failure—visibility, geometry interpretation, and attention management—map to different interventions and outcomes.</desc><style>.t{font-family:Inter,Arial,sans-serif;fill:#13283f}.m{font-size:14px;fill:#5e6d7b}.c{fill:#fff;stroke:#d7e0e2;stroke-width:2}.a{fill:#fae7e1;stroke:#d85f45;stroke-width:3}.b{fill:#fff2cf;stroke:#9a6900;stroke-width:3}.d{fill:#dff2f2;stroke:#087e8b;stroke-width:3}</style><rect width="1200" height="650" fill="#f8fbfb"/><text class="t" x="600" y="45" text-anchor="middle" font-size="25" font-weight="900">Three visual bottlenecks require three different remedies</text>
<g transform="translate(45 95)"><rect class="a" width="340" height="450" rx="22"/><text class="t" x="170" y="45" text-anchor="middle" font-size="21" font-weight="900">1 · Visibility failure</text><rect class="c" x="35" y="80" width="270" height="145" rx="12"/><circle cx="170" cy="150" r="35" fill="#fff2cf"/><path d="M60 105L130 135L190 155" stroke="#087e8b" stroke-width="22" stroke-linecap="round"/><text class="t m" x="170" y="265" text-anchor="middle">Self-occlusion · blocked contact edge</text><text class="t" x="45" y="315" font-size="16" font-weight="850">Useful remedy</text><text class="t m" x="45" y="345">Change or reveal the viewpoint.</text><text class="t m" x="45" y="375">Measure target visibility.</text><text class="t" x="45" y="420" font-size="16" font-weight="850">Primary outcome</text><text class="t m" x="45" y="450">contact / drop / placement error</text></g>
<g transform="translate(430 95)"><rect class="b" width="340" height="450" rx="22"/><text class="t" x="170" y="45" text-anchor="middle" font-size="21" font-weight="900">2 · Interpretation failure</text><rect class="c" x="35" y="80" width="270" height="145" rx="12"/><line x1="80" y1="185" x2="260" y2="185" stroke="#13283f" stroke-width="4"/><rect x="105" y="130" width="55" height="55" fill="#dff2f2" stroke="#087e8b" stroke-width="3"/><rect x="190" y="115" width="55" height="70" fill="#fae7e1" stroke="#d85f45" stroke-width="3"/><text class="t m" x="170" y="265" text-anchor="middle">Depth ambiguity · frame misalignment</text><text class="t" x="45" y="315" font-size="16" font-weight="850">Useful remedy</text><text class="t m" x="45" y="345">Side evidence and stable mapping.</text><text class="t m" x="45" y="375">Do not confound camera axes.</text><text class="t" x="45" y="420" font-size="16" font-weight="850">Primary outcome</text><text class="t m" x="45" y="450">path, jerk, correction, time</text></g>
<g transform="translate(815 95)"><rect class="d" width="340" height="450" rx="22"/><text class="t" x="170" y="45" text-anchor="middle" font-size="21" font-weight="900">3 · Allocation failure</text><rect class="c" x="35" y="80" width="270" height="145" rx="12"/><rect x="55" y="100" width="105" height="75" fill="#e8eff0"/><rect x="180" y="100" width="105" height="75" fill="#e8eff0"/><circle cx="105" cy="137" r="12" fill="#087e8b"/><path d="M120 137C160 115 175 120 198 137" fill="none" stroke="#d85f45" stroke-width="4" stroke-dasharray="6 5"/><text class="t m" x="170" y="265" text-anchor="middle">Critical evidence not inspected</text><text class="t" x="45" y="315" font-size="16" font-weight="850">Useful remedy</text><text class="t m" x="45" y="345">Selective, stable information cue.</text><text class="t m" x="45" y="375">Avoid persistent visual clutter.</text><text class="t" x="45" y="420" font-size="16" font-weight="850">Primary outcome</text><text class="t m" x="45" y="450">view/gaze transitions, workload</text></g>
<text class="t m" x="600" y="610" text-anchor="middle">Sightline addresses the overlap of visibility risk and allocation failure—not every teleoperation error.</text></svg>
