<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Related work and contribution boundary</title><desc id="desc">Established research families surround the proposed contribution, which focuses on uncertainty-aware screen gaze, abstention, xArm adaptation, and ablations.</desc>
  <rect width="1120" height="520" rx="28" fill="#f9fbfb"/><g font-family="system-ui"><text x="50" y="50" fill="#5f7180" font-size="16" font-weight="800" letter-spacing="2">NOVELTY IS THE GAP BETWEEN BASELINES, NOT THE COMPONENT LIST</text>
  <g transform="translate(48 90)"><rect width="255" height="130" rx="19" fill="#edf1f6" stroke="#b6c4cf"/><text x="22" y="35" fill="#17364c" font-size="14" font-weight="850">VLA FOUNDATIONS</text><text x="22" y="69" fill="#17364c" font-size="20" font-weight="800">OpenVLA · OFT · OXE</text><text x="22" y="100" fill="#536a78" font-size="13">language-conditioned policies</text><text x="22" y="120" fill="#536a78" font-size="13">and cross-embodiment data</text></g>
  <g transform="translate(48 282)"><rect width="255" height="130" rx="19" fill="#fff0e9" stroke="#e0ad9f"/><text x="22" y="35" fill="#ba4d35" font-size="14" font-weight="850">GAZE ROBOT CONTROL</text><text x="22" y="69" fill="#17364c" font-size="20" font-weight="800">GazeGrasp · GAMMA</text><text x="22" y="100" fill="#536a78" font-size="13">gaze-selected objects, skills,</text><text x="22" y="120" fill="#536a78" font-size="13">and modular autonomy</text></g>
  <g transform="translate(817 90)"><rect width="255" height="130" rx="19" fill="#fff5df" stroke="#e6cc91"/><text x="22" y="35" fill="#8b610a" font-size="14" font-weight="850">GAZE-CONDITIONED VLA</text><text x="22" y="69" fill="#17364c" font-size="20" font-weight="800">Gaze2Act</text><text x="22" y="100" fill="#536a78" font-size="13">cross-view grounding, prompting,</text><text x="22" y="120" fill="#536a78" font-size="13">conditioning, dynamic intent</text></g>
  <g transform="translate(817 282)"><rect width="255" height="130" rx="19" fill="#e9f4ed" stroke="#a6cbb4"/><text x="22" y="35" fill="#2d7a4c" font-size="14" font-weight="850">ROBOT DATA + DEPLOYMENT</text><text x="22" y="69" fill="#17364c" font-size="20" font-weight="800">DROID · xarm_ros2</text><text x="22" y="100" fill="#536a78" font-size="13">episode design, real hardware,</text><text x="22" y="120" fill="#536a78" font-size="13">calibration and guarded control</text></g>
  <rect x="348" y="125" width="424" height="255" rx="28" fill="#17364c"/><text x="560" y="166" fill="#82d1d4" text-anchor="middle" font-size="15" font-weight="850">GAZEPICK'S DEFENSIBLE CENTER</text><text x="382" y="211" fill="white" font-size="20" font-weight="800">1 · screen-based Tobii uncertainty</text><text x="382" y="250" fill="white" font-size="20" font-weight="800">2 · calibrated abstention + confirmation</text><text x="382" y="289" fill="white" font-size="20" font-weight="800">3 · physical xArm adaptation evidence</text><text x="382" y="328" fill="white" font-size="20" font-weight="800">4 · classical / frozen / tuned ablations</text><text x="560" y="359" fill="#f1c56b" text-anchor="middle" font-size="13">conditional on measurable improvement</text>
  <path d="M305 155h40M305 347h40M775 155h39M775 347h39" stroke="#849aa7" stroke-width="4"/></g>
</svg>
