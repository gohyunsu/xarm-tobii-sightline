<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
<title id="title">One Sightline-xArm trial</title><desc id="desc">Calibration, approach, occlusion, trigger eligibility, auxiliary view, operator decision, and outcome recording in temporal order.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#087e8b"/></marker><style>.t{font-family:Inter,Arial,sans-serif;fill:#13283f}.h{font-weight:800;font-size:19px}.m{font-size:13px;fill:#5e6d7b}.line{stroke:#087e8b;stroke-width:5;marker-end:url(#a)}.box{fill:#fff;stroke:#d7e0e2;stroke-width:2}</style></defs>
<rect width="1200" height="570" fill="#f9fbfb"/><text class="t" x="600" y="48" text-anchor="middle" font-size="25" font-weight="850">Temporal order within one trial</text><line class="line" x1="95" y1="280" x2="1110" y2="280"/>
<g transform="translate(90 0)"><circle cy="280" r="24" fill="#13283f"/><rect class="box" x="-70" y="105" width="140" height="110" rx="18"/><text class="t h" y="145" text-anchor="middle">0 · Validate</text><text class="t m" y="174" text-anchor="middle">Tobii calibration</text><text class="t m" y="198" text-anchor="middle">sync audit</text></g>
<g transform="translate(270 0)"><circle cy="280" r="24" fill="#087e8b"/><rect class="box" x="-70" y="340" width="140" height="110" rx="18"/><text class="t h" y="380" text-anchor="middle">1 · Approach</text><text class="t m" y="409" text-anchor="middle">overhead main</text><text class="t m" y="433" text-anchor="middle">manual control</text></g>
<g transform="translate(450 0)"><circle cy="280" r="24" fill="#d85f45"/><rect x="-70" y="105" width="140" height="110" rx="18" fill="#fae7e1" stroke="#e5b2a5" stroke-width="2"/><text class="t h" y="145" text-anchor="middle">2 · Occlude</text><text class="t m" y="174" text-anchor="middle">gripper covers target</text><text class="t m" y="198" text-anchor="middle">contact edge hidden</text></g>
<g transform="translate(630 0)"><circle cy="280" r="24" fill="#9a6900"/><rect x="-78" y="340" width="156" height="110" rx="18" fill="#fff2cf" stroke="#e9d9a9" stroke-width="2"/><text class="t h" y="380" text-anchor="middle">3 · Eligible</text><text class="t m" y="409" text-anchor="middle">risk is high ×</text><text class="t m" y="433" text-anchor="middle">contact AOI uninspected</text></g>
<g transform="translate(810 0)"><circle cy="280" r="24" fill="#087e8b"/><rect class="box" x="-75" y="105" width="150" height="110" rx="18"/><text class="t h" y="145" text-anchor="middle">4 · Assist</text><text class="t m" y="174" text-anchor="middle">enlarge side / wrist</text><text class="t m" y="198" text-anchor="middle">no motion generated</text></g>
<g transform="translate(990 0)"><circle cy="280" r="24" fill="#13283f"/><rect class="box" x="-75" y="340" width="150" height="110" rx="18"/><text class="t h" y="380" text-anchor="middle">5 · Decide</text><text class="t m" y="409" text-anchor="middle">continue / correct / stop</text><text class="t m" y="433" text-anchor="middle">explicit input</text></g>
<text class="t m" x="600" y="530" text-anchor="middle">Same trial ID: contact · drop · placement error · time · view/gaze transitions · workload</text>
</svg>
