<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
<title id="title">Sightline-xArm 실험 한 회차</title><desc id="desc">보정, 접근, 가림 발생, 미검사 영역 검출, 보조 시점 표시, 명시적 조작, 결과 기록의 순서.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#087e8b"/></marker><style>.t{font-family:Pretendard,'Noto Sans KR',sans-serif;fill:#13283f}.h{font-weight:800;font-size:20px}.m{font-size:14px;fill:#5e6d7b}.line{stroke:#087e8b;stroke-width:5;marker-end:url(#a)}.box{fill:#fff;stroke:#d7e0e2;stroke-width:2}</style></defs>
<rect width="1200" height="570" fill="#f9fbfb"/><text class="t" x="600" y="48" text-anchor="middle" font-size="25" font-weight="850">한 trial에서 무엇이 먼저 일어나는가</text>
<line class="line" x1="95" y1="280" x2="1110" y2="280"/>
<g transform="translate(90 0)"><circle cx="0" cy="280" r="24" fill="#13283f"/><rect class="box" x="-70" y="105" width="140" height="110" rx="18"/><text class="t h" x="0" y="145" text-anchor="middle">0 · 보정</text><text class="t m" x="0" y="174" text-anchor="middle">Tobii validation</text><text class="t m" x="0" y="198" text-anchor="middle">시간 동기화</text></g>
<g transform="translate(270 0)"><circle cx="0" cy="280" r="24" fill="#087e8b"/><rect class="box" x="-70" y="340" width="140" height="110" rx="18"/><text class="t h" x="0" y="380" text-anchor="middle">1 · 접근</text><text class="t m" x="0" y="409" text-anchor="middle">overhead main</text><text class="t m" x="0" y="433" text-anchor="middle">직접 조작</text></g>
<g transform="translate(450 0)"><circle cx="0" cy="280" r="24" fill="#d85f45"/><rect x="-70" y="105" width="140" height="110" rx="18" fill="#fae7e1" stroke="#e5b2a5" stroke-width="2"/><text class="t h" x="0" y="145" text-anchor="middle">2 · 가림</text><text class="t m" x="0" y="174" text-anchor="middle">gripper–target</text><text class="t m" x="0" y="198" text-anchor="middle">접촉부가 안 보임</text></g>
<g transform="translate(630 0)"><circle cx="0" cy="280" r="24" fill="#9a6900"/><rect x="-75" y="340" width="150" height="110" rx="18" fill="#fff2cf" stroke="#e9d9a9" stroke-width="2"/><text class="t h" x="0" y="380" text-anchor="middle">3 · 조건 충족</text><text class="t m" x="0" y="409" text-anchor="middle">risk 높음 ×</text><text class="t m" x="0" y="433" text-anchor="middle">contact AOI 미검사</text></g>
<g transform="translate(810 0)"><circle cx="0" cy="280" r="24" fill="#087e8b"/><rect class="box" x="-75" y="105" width="150" height="110" rx="18"/><text class="t h" x="0" y="145" text-anchor="middle">4 · 보조 시점</text><text class="t m" x="0" y="174" text-anchor="middle">side / wrist 확대</text><text class="t m" x="0" y="198" text-anchor="middle">로봇은 계속 안 움직임</text></g>
<g transform="translate(990 0)"><circle cx="0" cy="280" r="24" fill="#13283f"/><rect class="box" x="-75" y="340" width="150" height="110" rx="18"/><text class="t h" x="0" y="380" text-anchor="middle">5 · 사람 결정</text><text class="t m" x="0" y="409" text-anchor="middle">계속 / 수정 / 중지</text><text class="t m" x="0" y="433" text-anchor="middle">명시적 입력</text></g>
<text class="t m" x="600" y="530" text-anchor="middle">결과: 접촉 오류 · drop · 배치 편차 · 시간 · view 전환 · gaze 전환 · 주관적 workload를 같은 trial ID로 기록</text>
</svg>
