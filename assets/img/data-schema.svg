<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Sightline Episodes 시간 동기화 데이터 구조</title><desc id="desc">시선, 로봇 상태, 운영자 입력, 카메라와 인터페이스, 장면 정답, 결과가 공통 trial과 timestamp로 연결된다.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#087e8b"/></marker><style>.t{font-family:Pretendard,'Noto Sans KR',sans-serif;fill:#13283f}.h{font-size:19px;font-weight:850}.m{font-size:14px;fill:#5e6d7b}.box{fill:#fff;stroke:#d7e0e2;stroke-width:2}.line{stroke:#087e8b;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1200" height="650" fill="#f8fbfb"/>
<text class="t" x="600" y="45" text-anchor="middle" font-size="25" font-weight="900">Sightline Episodes · “같은 순간”을 잃지 않는 데이터셋</text>
<rect x="445" y="260" width="310" height="125" rx="24" fill="#dff2f2" stroke="#087e8b" stroke-width="3"/><text class="t" x="600" y="300" text-anchor="middle" font-size="22" font-weight="900">episode clock</text><text class="t m" x="600" y="332" text-anchor="middle">participant · trial · monotonic time</text><text class="t m" x="600" y="359" text-anchor="middle">event ID · condition · phase</text>
<g transform="translate(55 90)"><rect class="box" width="280" height="125" rx="20"/><text class="t h" x="140" y="38" text-anchor="middle">Tobii stream</text><text class="t m" x="140" y="70" text-anchor="middle">x, y · validity · eye origin</text><text class="t m" x="140" y="96" text-anchor="middle">calibration error · missing</text></g>
<g transform="translate(460 75)"><rect class="box" width="280" height="125" rx="20"/><text class="t h" x="140" y="38" text-anchor="middle">UI / camera stream</text><text class="t m" x="140" y="70" text-anchor="middle">active view · layout · cue</text><text class="t m" x="140" y="96" text-anchor="middle">AOI polygon · frame ID</text></g>
<g transform="translate(865 90)"><rect class="box" width="280" height="125" rx="20"/><text class="t h" x="140" y="38" text-anchor="middle">xArm telemetry</text><text class="t m" x="140" y="70" text-anchor="middle">joint · TCP · gripper</text><text class="t m" x="140" y="96" text-anchor="middle">error · mode · state</text></g>
<g transform="translate(55 445)"><rect class="box" width="280" height="125" rx="20"/><text class="t h" x="140" y="38" text-anchor="middle">operator input</text><text class="t m" x="140" y="70" text-anchor="middle">axis · buttons · E-stop</text><text class="t m" x="140" y="96" text-anchor="middle">manual view request</text></g>
<g transform="translate(460 460)"><rect class="box" width="280" height="125" rx="20"/><text class="t h" x="140" y="38" text-anchor="middle">scene truth</text><text class="t m" x="140" y="70" text-anchor="middle">occlusion · target · contact</text><text class="t m" x="140" y="96" text-anchor="middle">task phase · difficulty</text></g>
<g transform="translate(865 445)"><rect class="box" width="280" height="125" rx="20"/><text class="t h" x="140" y="38" text-anchor="middle">outcomes</text><text class="t m" x="140" y="70" text-anchor="middle">collision · drop · deviation</text><text class="t m" x="140" y="96" text-anchor="middle">time · TLX · usability</text></g>
<line class="line" x1="335" y1="205" x2="445" y2="275"/><line class="line" x1="600" y1="200" x2="600" y2="252"/><line class="line" x1="865" y1="205" x2="755" y2="275"/><line class="line" x1="335" y1="480" x2="445" y2="370"/><line class="line" x1="600" y1="460" x2="600" y2="393"/><line class="line" x1="865" y1="480" x2="755" y2="370"/>
</svg>
