<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">Four camera-interface conditions</title><desc id="desc">Comparison of manual switching, persistent multiview, geometry-triggered assistance, and Sightline gaze-plus-geometry assistance.</desc>
<style>.t{font-family:Inter,Arial,sans-serif;fill:#13283f}.h{font-weight:850;font-size:20px}.m{font-size:14px;fill:#5e6d7b}.card{fill:#fff;stroke:#d7e0e2;stroke-width:2}.screen{fill:#e7eef0;stroke:#7d939a;stroke-width:2}.accent{fill:#dff2f2;stroke:#087e8b;stroke-width:3}</style><rect width="1200" height="690" fill="#f8fbfb"/>
<text class="t" x="600" y="45" text-anchor="middle" font-size="25" font-weight="900">What must Sightline beat before gaze has incremental value?</text>
<g transform="translate(35 82)"><rect class="card" width="265" height="510" rx="22"/><text class="t h" x="132" y="42" text-anchor="middle">C0 · Manual switch</text><rect class="screen" x="35" y="78" width="195" height="135" rx="8"/><rect x="35" y="228" width="57" height="42" rx="5" fill="#d9e1e3"/><rect x="104" y="228" width="57" height="42" rx="5" fill="#d9e1e3"/><rect x="173" y="228" width="57" height="42" rx="5" fill="#d9e1e3"/><text class="t m" x="132" y="310" text-anchor="middle">Operator selects tabs / keys</text><text class="t m" x="132" y="343" text-anchor="middle">+ explicit control</text><text class="t m" x="132" y="371" text-anchor="middle">− delay and missed evidence</text><text class="t m" x="132" y="430" text-anchor="middle">Control baseline</text></g>
<g transform="translate(325 82)"><rect class="card" width="265" height="510" rx="22"/><text class="t h" x="132" y="42" text-anchor="middle">C1 · Always multiview</text><rect class="screen" x="25" y="78" width="102" height="88" rx="7"/><rect class="screen" x="138" y="78" width="102" height="88" rx="7"/><rect class="screen" x="82" y="177" width="102" height="88" rx="7"/><text class="t m" x="132" y="310" text-anchor="middle">Three views stay visible</text><text class="t m" x="132" y="343" text-anchor="middle">+ maximal availability</text><text class="t m" x="132" y="371" text-anchor="middle">− smaller views and switching</text><text class="t m" x="132" y="430" text-anchor="middle">Human-factors baseline</text></g>
<g transform="translate(615 82)"><rect class="card" width="265" height="510" rx="22"/><text class="t h" x="132" y="42" text-anchor="middle">C2 · Geometry only</text><rect class="screen" x="35" y="78" width="195" height="135" rx="8"/><rect class="accent" x="145" y="158" width="85" height="70" rx="7"/><path d="M70 122L112 150L154 110" fill="none" stroke="#d85f45" stroke-width="5"/><text class="t m" x="132" y="310" text-anchor="middle">Risk / occlusion triggers view</text><text class="t m" x="132" y="343" text-anchor="middle">+ scene-aware timing</text><text class="t m" x="132" y="371" text-anchor="middle">− does not know what was seen</text><text class="t m" x="132" y="430" text-anchor="middle">Critical gaze ablation</text></g>
<g transform="translate(905 82)"><rect width="265" height="510" rx="22" fill="#eef9f8" stroke="#087e8b" stroke-width="4"/><text class="t h" x="132" y="42" text-anchor="middle">C3 · Sightline</text><rect class="screen" x="35" y="78" width="195" height="135" rx="8"/><rect class="accent" x="145" y="158" width="85" height="70" rx="7"/><circle cx="105" cy="128" r="16" fill="none" stroke="#087e8b" stroke-width="4"/><circle cx="105" cy="128" r="5" fill="#087e8b"/><text class="t m" x="132" y="310" text-anchor="middle">Risk × inspection deficit</text><text class="t m" x="132" y="343" text-anchor="middle">+ assistance only when needed</text><text class="t m" x="132" y="371" text-anchor="middle">− depends on gaze quality</text><text class="t m" x="132" y="430" text-anchor="middle">Proposed condition</text></g>
<path d="M760 625H1040" stroke="#d85f45" stroke-width="4"/><path d="M760 625l16-9v18z" fill="#d85f45"/><path d="M1040 625l-16-9v18z" fill="#d85f45"/><text class="t" x="900" y="657" text-anchor="middle" font-size="17" font-weight="900" fill="#a63737">PRIMARY CONTRAST · C3 − C2</text>
</svg>
