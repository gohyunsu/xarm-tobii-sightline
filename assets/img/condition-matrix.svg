<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">네 가지 카메라 인터페이스 조건</title><desc id="desc">수동 전환, 항상 켜진 다중 화면, 기하 기반 자동 보조, 시선과 기하를 결합한 Sightline 조건 비교.</desc>
<style>.t{font-family:Pretendard,'Noto Sans KR',sans-serif;fill:#13283f}.h{font-weight:850;font-size:21px}.m{font-size:15px;fill:#5e6d7b}.card{fill:#fff;stroke:#d7e0e2;stroke-width:2}.screen{fill:#e7eef0;stroke:#7d939a;stroke-width:2}.accent{fill:#dff2f2;stroke:#087e8b;stroke-width:3}</style><rect width="1200" height="650" fill="#f8fbfb"/>
<text class="t" x="600" y="48" text-anchor="middle" font-size="26" font-weight="900">무엇과 비교해야 “gaze의 추가 가치”를 말할 수 있는가</text>
<g transform="translate(35 90)"><rect class="card" width="265" height="500" rx="22"/><text class="t h" x="132" y="42" text-anchor="middle">C0 · Manual switch</text><rect class="screen" x="35" y="78" width="195" height="135" rx="8"/><rect x="35" y="228" width="57" height="42" rx="5" fill="#d9e1e3"/><rect x="104" y="228" width="57" height="42" rx="5" fill="#d9e1e3"/><rect x="173" y="228" width="57" height="42" rx="5" fill="#d9e1e3"/><text class="t m" x="132" y="315" text-anchor="middle">운영자가 탭/키로 전환</text><text class="t m" x="132" y="348" text-anchor="middle">+ 통제권 명확</text><text class="t m" x="132" y="376" text-anchor="middle">− 전환 지연·누락</text><text class="t m" x="132" y="430" text-anchor="middle">기준선</text></g>
<g transform="translate(325 90)"><rect class="card" width="265" height="500" rx="22"/><text class="t h" x="132" y="42" text-anchor="middle">C1 · Always multi</text><rect class="screen" x="25" y="78" width="102" height="88" rx="7"/><rect class="screen" x="138" y="78" width="102" height="88" rx="7"/><rect class="screen" x="82" y="177" width="102" height="88" rx="7"/><text class="t m" x="132" y="315" text-anchor="middle">3개 view 항상 표시</text><text class="t m" x="132" y="348" text-anchor="middle">+ 정보 가용성</text><text class="t m" x="132" y="376" text-anchor="middle">− 시각 분할·전환 비용</text><text class="t m" x="132" y="430" text-anchor="middle">강한 인간공학 기준선</text></g>
<g transform="translate(615 90)"><rect class="card" width="265" height="500" rx="22"/><text class="t h" x="132" y="42" text-anchor="middle">C2 · Geometry-only</text><rect class="screen" x="35" y="78" width="195" height="135" rx="8"/><rect class="accent" x="145" y="158" width="85" height="70" rx="7"/><path d="M70 122L112 150L154 110" fill="none" stroke="#d85f45" stroke-width="5"/><text class="t m" x="132" y="315" text-anchor="middle">가림·거리 위험으로 표시</text><text class="t m" x="132" y="348" text-anchor="middle">+ 장면 상태 반영</text><text class="t m" x="132" y="376" text-anchor="middle">− 사람이 이미 봤는지 모름</text><text class="t m" x="132" y="430" text-anchor="middle">gaze ablation</text></g>
<g transform="translate(905 90)"><rect width="265" height="500" rx="22" fill="#eef9f8" stroke="#087e8b" stroke-width="4"/><text class="t h" x="132" y="42" text-anchor="middle">C3 · Sightline</text><rect class="screen" x="35" y="78" width="195" height="135" rx="8"/><rect class="accent" x="145" y="158" width="85" height="70" rx="7"/><circle cx="105" cy="128" r="16" fill="none" stroke="#087e8b" stroke-width="4"/><circle cx="105" cy="128" r="5" fill="#087e8b"/><text class="t m" x="132" y="315" text-anchor="middle">risk × 미검사 영역</text><text class="t m" x="132" y="348" text-anchor="middle">+ 필요한 순간만 표시</text><text class="t m" x="132" y="376" text-anchor="middle">− gaze 품질 의존</text><text class="t m" x="132" y="430" text-anchor="middle">제안 조건</text></g>
</svg>
