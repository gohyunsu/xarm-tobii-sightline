<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
<title id="title">Research-gap map</title><desc id="desc">The horizontal axis moves from gaze as passive measurement to gaze as direct command. The vertical axis moves from fixed camera layouts to adaptive camera behavior.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#445d69"/></marker><style>.t{font-family:Inter,Arial,sans-serif;fill:#13283f}.m{font-size:15px;fill:#5e6d7b}.axis{stroke:#445d69;stroke-width:3;marker-end:url(#a)}.grid{stroke:#dbe3e5;stroke-width:1}.p{fill:#fff;stroke:#7b9199;stroke-width:2}.s{fill:#dff2f2;stroke:#087e8b;stroke-width:4}</style></defs>
<rect width="1100" height="720" fill="#f9fbfb"/><text class="t" x="550" y="45" text-anchor="middle" font-size="25" font-weight="900">Separate the role of gaze from the degree of camera automation</text>
<line class="grid" x1="180" y1="160" x2="980" y2="160"/><line class="grid" x1="180" y1="310" x2="980" y2="310"/><line class="grid" x1="180" y1="460" x2="980" y2="460"/><line class="grid" x1="380" y1="90" x2="380" y2="610"/><line class="grid" x1="580" y1="90" x2="580" y2="610"/><line class="grid" x1="780" y1="90" x2="780" y2="610"/>
<line class="axis" x1="180" y1="610" x2="1000" y2="610"/><line class="axis" x1="180" y1="610" x2="180" y2="80"/>
<text class="t m" x="180" y="648">gaze = retrospective measure</text><text class="t m" x="980" y="648" text-anchor="end">gaze = intent / direct command</text><text class="t m" x="75" y="600" transform="rotate(-90 75 600)">fixed camera</text><text class="t m" x="75" y="190" transform="rotate(-90 75 190)">adaptive camera</text>
<g transform="translate(295 500)"><rect class="p" x="-95" y="-40" width="190" height="80" rx="16"/><text class="t" y="-8" text-anchor="middle" font-size="16" font-weight="800">SEEV / workload</text><text class="t m" y="20" text-anchor="middle">gaze evaluates the UI</text></g>
<g transform="translate(350 360)"><rect class="p" x="-115" y="-42" width="230" height="84" rx="16"/><text class="t" y="-9" text-anchor="middle" font-size="16" font-weight="800">Multiview ergonomics</text><text class="t m" y="20" text-anchor="middle">gaze is an outcome</text></g>
<g transform="translate(520 180)"><rect class="p" x="-115" y="-42" width="230" height="84" rx="16"/><text class="t" y="-9" text-anchor="middle" font-size="16" font-weight="800">Adaptive viewpoints</text><text class="t m" y="20" text-anchor="middle">geometry / occlusion</text></g>
<g transform="translate(845 460)"><rect class="p" x="-105" y="-42" width="210" height="84" rx="16"/><text class="t" y="-9" text-anchor="middle" font-size="16" font-weight="800">Gaze intent / control</text><text class="t m" y="20" text-anchor="middle">infer target or action</text></g>
<g transform="translate(800 210)"><rect class="p" x="-110" y="-42" width="220" height="84" rx="16"/><text class="t" y="-9" text-anchor="middle" font-size="16" font-weight="800">Gaze camera control</text><text class="t m" y="20" text-anchor="middle">gaze drives camera servo</text></g>
<g transform="translate(565 305)"><rect class="s" x="-132" y="-58" width="264" height="116" rx="20"/><text class="t" y="-21" text-anchor="middle" font-size="21" font-weight="900">Sightline-xArm</text><text class="t m" y="9" text-anchor="middle">gaze = inspection evidence</text><text class="t m" y="34" text-anchor="middle">view = risk-gated suggestion</text></g>
<text class="t m" x="550" y="690" text-anchor="middle">The position is not the contribution; improvement over geometry-only is.</text>
</svg>
