<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc"><title id="title">Go/no-go research gates</title><desc id="desc">Six gates covering inventory, licensing, safety, synchronization, task validity, and ethics must be passed before confirmatory data collection.</desc><style>.t{font-family:Inter,Arial,sans-serif;fill:#13283f}.m{font-size:13px;fill:#5e6d7b}.g{fill:#fff;stroke:#d7e0e2;stroke-width:2}.pass{fill:#dff2f2;stroke:#087e8b;stroke-width:3}.stop{fill:#fae7e1;stroke:#d85f45;stroke-width:3}</style><rect width="1200" height="580" fill="#f8fbfb"/><text class="t" x="600" y="45" text-anchor="middle" font-size="25" font-weight="900">Human data begins only after six auditable gates</text>
<path d="M90 240H1110" stroke="#aebfc4" stroke-width="6"/><g transform="translate(55 115)"><rect class="g" width="165" height="245" rx="20"/><circle cx="82" cy="125" r="28" fill="#13283f"/><text x="82" y="133" text-anchor="middle" fill="#fff" font-family="Inter,Arial" font-weight="900">G0</text><text class="t" x="82" y="38" text-anchor="middle" font-size="18" font-weight="850">Inventory</text><text class="t m" x="82" y="185" text-anchor="middle">model · firmware</text><text class="t m" x="82" y="210" text-anchor="middle">camera · OS · SKU</text></g>
<g transform="translate(240 115)"><rect class="g" width="165" height="245" rx="20"/><circle cx="82" cy="125" r="28" fill="#9a6900"/><text x="82" y="133" text-anchor="middle" fill="#fff" font-family="Inter,Arial" font-weight="900">G1</text><text class="t" x="82" y="38" text-anchor="middle" font-size="18" font-weight="850">License</text><text class="t m" x="82" y="185" text-anchor="middle">record · transfer</text><text class="t m" x="82" y="210" text-anchor="middle">analyze gaze</text></g>
<g transform="translate(425 115)"><rect class="g" width="165" height="245" rx="20"/><circle cx="82" cy="125" r="28" fill="#d85f45"/><text x="82" y="133" text-anchor="middle" fill="#fff" font-family="Inter,Arial" font-weight="900">G2</text><text class="t" x="82" y="38" text-anchor="middle" font-size="18" font-weight="850">Safety</text><text class="t m" x="82" y="185" text-anchor="middle">barrier · E-stop</text><text class="t m" x="82" y="210" text-anchor="middle">guard · recovery</text></g>
<g transform="translate(610 115)"><rect class="g" width="165" height="245" rx="20"/><circle cx="82" cy="125" r="28" fill="#087e8b"/><text x="82" y="133" text-anchor="middle" fill="#fff" font-family="Inter,Arial" font-weight="900">G3</text><text class="t" x="82" y="38" text-anchor="middle" font-size="18" font-weight="850">Sync</text><text class="t m" x="82" y="185" text-anchor="middle">offset · drift</text><text class="t m" x="82" y="210" text-anchor="middle">drop residual</text></g>
<g transform="translate(795 115)"><rect class="g" width="165" height="245" rx="20"/><circle cx="82" cy="125" r="28" fill="#13283f"/><text x="82" y="133" text-anchor="middle" fill="#fff" font-family="Inter,Arial" font-weight="900">G4</text><text class="t" x="82" y="38" text-anchor="middle" font-size="18" font-weight="850">Task validity</text><text class="t m" x="82" y="185" text-anchor="middle">no floor / ceiling</text><text class="t m" x="82" y="210" text-anchor="middle">occlusion separates</text></g>
<g transform="translate(980 115)"><rect class="pass" width="165" height="245" rx="20"/><circle cx="82" cy="125" r="28" fill="#087e8b"/><text x="82" y="133" text-anchor="middle" fill="#fff" font-family="Inter,Arial" font-weight="900">G5</text><text class="t" x="82" y="38" text-anchor="middle" font-size="18" font-weight="850">Ethics</text><text class="t m" x="82" y="185" text-anchor="middle">consent · retention</text><text class="t m" x="82" y="210" text-anchor="middle">withdrawal · release</text></g>
<rect class="pass" x="650" y="430" width="430" height="85" rx="18"/><text class="t" x="865" y="465" text-anchor="middle" font-size="19" font-weight="900">PASS → confirmatory human study</text><text class="t m" x="865" y="493" text-anchor="middle">frozen protocol · powered H3 contrast</text><rect class="stop" x="120" y="430" width="430" height="85" rx="18"/><text class="t" x="335" y="465" text-anchor="middle" font-size="19" font-weight="900">FAIL → reduce scope</text><text class="t m" x="335" y="493" text-anchor="middle">simulation · shadow mode · geometry-only</text></svg>
