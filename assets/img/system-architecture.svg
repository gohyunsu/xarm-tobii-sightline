<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 650" role="img" aria-labelledby="title desc">
  <title id="title">GazePick system architecture</title><desc id="desc">Tobii, camera, speech, grounding, VLA, guard, and xArm components with separated data and motion authority.</desc>
  <rect width="1180" height="650" rx="30" fill="#f8fbfb"/>
  <g font-family="system-ui"><text x="50" y="52" fill="#5f7180" font-size="16" font-weight="800" letter-spacing="2">REFERENCE ARCHITECTURE · DATA LEFT TO RIGHT · AUTHORITY TOP TO BOTTOM</text>
  <g transform="translate(48 92)"><rect width="250" height="110" rx="18" fill="#e2f3f3" stroke="#82c1c5"/><text x="22" y="36" fill="#087e8b" font-size="14" font-weight="850">HUMAN INPUT</text><text x="22" y="70" fill="#17364c" font-size="22" font-weight="800">Tobii + microphone</text><text x="22" y="94" fill="#5c6e7a" font-size="13">gaze samples · validity · utterance</text></g>
  <g transform="translate(48 230)"><rect width="250" height="110" rx="18" fill="#edf1f6" stroke="#b4c2ce"/><text x="22" y="36" fill="#17364c" font-size="14" font-weight="850">ROBOT OBSERVATION</text><text x="22" y="70" fill="#17364c" font-size="22" font-weight="800">RGB(/D) + xArm state</text><text x="22" y="94" fill="#5c6e7a" font-size="13">frames · joints · TCP · gripper</text></g>
  <g transform="translate(362 92)"><rect width="250" height="248" rx="18" fill="#fff" stroke="#ccd9dc"/><text x="22" y="36" fill="#087e8b" font-size="14" font-weight="850">REFERENT GROUNDING</text><text x="22" y="72" fill="#17364c" font-size="21" font-weight="800">screen transform</text><text x="22" y="104" fill="#17364c" font-size="21" font-weight="800">temporal gaze filter</text><text x="22" y="136" fill="#17364c" font-size="21" font-weight="800">candidate masks</text><text x="22" y="168" fill="#17364c" font-size="21" font-weight="800">language fusion</text><line x1="22" y1="190" x2="228" y2="190" stroke="#d7e0e2"/><text x="22" y="218" fill="#d05c43" font-size="13" font-weight="750">output: posterior or abstain</text></g>
  <g transform="translate(676 92)"><rect width="218" height="248" rx="18" fill="#17364c"/><text x="22" y="36" fill="#83d2d5" font-size="14" font-weight="850">VLA ADAPTER</text><text x="22" y="78" fill="white" font-size="21" font-weight="800">image + prompt</text><text x="22" y="110" fill="white" font-size="21" font-weight="800">+ gaze feature</text><line x1="22" y1="138" x2="196" y2="138" stroke="#527184"/><text x="22" y="170" fill="#c6d8df" font-size="14">frozen / LoRA / OFT</text><text x="22" y="201" fill="#c6d8df" font-size="14">action chunk or skill</text><text x="22" y="228" fill="#f0c46d" font-size="13">proposal only</text></g>
  <g transform="translate(958 92)"><rect width="174" height="248" rx="18" fill="#e8f4ec" stroke="#96c4a7"/><text x="20" y="36" fill="#2d7a4c" font-size="14" font-weight="850">INTERFACE</text><text x="20" y="77" fill="#17364c" font-size="18" font-weight="800">target overlay</text><text x="20" y="109" fill="#17364c" font-size="18" font-weight="800">confidence</text><text x="20" y="141" fill="#17364c" font-size="18" font-weight="800">confirm / retry</text><text x="20" y="173" fill="#17364c" font-size="18" font-weight="800">status + faults</text><text x="20" y="220" fill="#2d7a4c" font-size="13">human remains in loop</text></g>
  <path d="M300 147h58M300 285h58M614 216h58M896 216h58" stroke="#7f96a3" stroke-width="4"/>
  <rect x="362" y="402" width="532" height="104" rx="20" fill="#fff4df" stroke="#e4c988"/><text x="388" y="437" fill="#8d620b" font-size="14" font-weight="850">INDEPENDENT EXECUTION GUARD</text><text x="388" y="472" fill="#17364c" font-size="19" font-weight="800">confirmation · workspace · speed · path · state · watchdog · E-stop</text>
  <path d="M785 342v55" stroke="#7f96a3" stroke-width="4"/><path d="M774 384l11 14 11-14" fill="none" stroke="#7f96a3" stroke-width="4"/>
  <rect x="470" y="548" width="316" height="64" rx="18" fill="#2d7a4c"/><text x="628" y="588" fill="white" text-anchor="middle" font-size="24" font-weight="850">xArm + gripper</text><path d="M628 508v36" stroke="#7f96a3" stroke-width="4"/>
  <rect x="48" y="402" width="250" height="210" rx="20" fill="#edf1f6" stroke="#b5c3ce"/><text x="70" y="437" fill="#17364c" font-size="14" font-weight="850">SYNCHRONIZED EPISODE LOG</text><text x="70" y="474" fill="#4e6473" font-size="15">raw gaze + calibration</text><text x="70" y="503" fill="#4e6473" font-size="15">audio/transcript + images</text><text x="70" y="532" fill="#4e6473" font-size="15">posterior + decisions</text><text x="70" y="561" fill="#4e6473" font-size="15">actions + robot state</text><text x="70" y="590" fill="#4e6473" font-size="15">outcomes + faults</text>
  <path d="M332 402V365H1045V344" fill="none" stroke="#a9b8c1" stroke-width="2" stroke-dasharray="7 6"/></g>
</svg>
