  <rect x="782" y="282" width="286" height="142" rx="22" fill="#fff" filter="url(#s)"/><text x="808" y="316" fill="#087e8b" font-family="system-ui" font-size="14" font-weight="800">ACTION PROPOSAL</text><text x="808" y="355" fill="#17364c" font-family="system-ui" font-size="23" font-weight="800">pick(B) → place(blue)</text><text x="808" y="389" fill="#6a7883" font-family="system-ui" font-size="14">guarded skill or learned policy</text>
