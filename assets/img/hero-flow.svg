  <g><rect x="290" y="297" width="88" height="66" rx="12" fill="#80a9b1"/><circle cx="334" cy="330" r="17" fill="#dce8e9"/><text x="305" y="389" fill="#536b79" font-family="system-ui" font-size="14">part A</text></g>
  <g><rect x="414" y="294" width="88" height="69" rx="12" fill="#83abb4"/><circle cx="458" cy="329" r="17" fill="#dce8e9"/><text x="429" y="389" fill="#536b79" font-family="system-ui" font-size="14">part B</text></g>
  <g><rect x="536" y="300" width="88" height="63" rx="12" fill="#7fa6af"/><circle cx="580" cy="331" r="17" fill="#dce8e9"/><text x="551" y="389" fill="#536b79" font-family="system-ui" font-size="14">part C</text></g>
  <ellipse cx="458" cy="328" rx="92" ry="76" fill="url(#g)"/><circle cx="458" cy="328" r="8" fill="#f0a818"/><ellipse cx="458" cy="328" rx="58" ry="38" fill="none" stroke="#f0a818" stroke-width="3" stroke-dasharray="8 6"/>
  <path d="M458 286 C458 222 532 220 532 183" fill="none" stroke="#f0a818" stroke-width="3"/><rect x="407" y="178" width="248" height="52" rx="16" fill="#fff7dc"/><text x="428" y="210" fill="#725215" font-family="system-ui" font-size="17" font-weight="700">gaze = distribution, not click</text>
  <rect x="52" y="540" width="628" height="88" rx="20" fill="#ffffff" fill-opacity=".1" stroke="#ffffff" stroke-opacity=".18"/><text x="80" y="575" fill="#9fc9cd" font-family="system-ui" font-size="15">LANGUAGE</text><text x="80" y="607" fill="white" font-family="system-ui" font-size="24" font-weight="750">“Put this in the blue bin.”</text>
  <path d="M706 202 H754" stroke="#9dc9cb" stroke-width="4" stroke-linecap="round"/><path d="M744 190 l14 12-14 12" fill="none" stroke="#9dc9cb" stroke-width="4"/>
