<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
  <title id="title">GazePick interaction</title><desc id="desc">A robot camera view contains similar parts. A gaze probability region and spoken destination are fused, uncertainty is checked, and a guarded xArm performs pick and place.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10283f"/><stop offset="1" stop-color="#0a5964"/></linearGradient><radialGradient id="g"><stop stop-color="#ffd16a" stop-opacity=".78"/><stop offset="1" stop-color="#ffd16a" stop-opacity="0"/></radialGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-opacity=".22"/></filter></defs>
  <rect width="1120" height="680" rx="34" fill="url(#bg)"/>
  <text x="54" y="62" fill="#b9dfe0" font-family="system-ui" font-size="18" font-weight="700" letter-spacing="3">ONE COMPLETE EPISODE</text>
  <rect x="52" y="94" width="628" height="420" rx="24" fill="#f7fbfb" filter="url(#s)"/>
  <rect x="72" y="116" width="588" height="45" rx="12" fill="#e7f0f1"/><circle cx="98" cy="138" r="6" fill="#d85f45"/><circle cx="119" cy="138" r="6" fill="#d6a43d"/><circle cx="140" cy="138" r="6" fill="#0a8994"/><text x="166" y="144" fill="#506777" font-family="system-ui" font-size="16">overhead camera · live</text>
