<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 510" role="img" aria-labelledby="title desc">
  <title id="title">Uncertainty-aware object grounding</title><desc id="desc">Screen gaze is calibrated into image coordinates, represented as a distribution, integrated over object masks, fused with language, and either accepted or rejected.</desc>
  <defs><radialGradient id="heat"><stop stop-color="#f3ad23" stop-opacity=".85"/><stop offset="1" stop-color="#f3ad23" stop-opacity="0"/></radialGradient></defs><rect width="1120" height="510" rx="28" fill="#fbfcfc"/>
  <g font-family="system-ui"><text x="48" y="50" fill="#5f7180" font-size="16" font-weight="800" letter-spacing="2">FROM PIXELS TO A DEFENSIBLE REFERENT</text>
  <g transform="translate(48 88)"><rect width="220" height="300" rx="20" fill="#e6f2f3" stroke="#aed1d4"/><text x="22" y="34" fill="#087e8b" font-size="14" font-weight="850">1 · CALIBRATE</text><rect x="26" y="62" width="168" height="118" rx="12" fill="#17364c"/><line x1="110" y1="62" x2="110" y2="180" stroke="#4d7488"/><line x1="26" y1="121" x2="194" y2="121" stroke="#4d7488"/><circle cx="132" cy="110" r="8" fill="#f3ad23"/><text x="22" y="217" fill="#3f5868" font-size="15">display pixels → rendered</text><text x="22" y="241" fill="#3f5868" font-size="15">camera-image pixels</text><text x="22" y="274" fill="#865a0a" font-size="13">Preserve calibration error.</text></g>
  <g transform="translate(316 88)"><rect width="220" height="300" rx="20" fill="#fff5df" stroke="#ead19a"/><text x="22" y="34" fill="#8c610b" font-size="14" font-weight="850">2 · MODEL UNCERTAINTY</text><rect x="26" y="62" width="168" height="118" rx="12" fill="#eef3f4"/><ellipse cx="110" cy="121" rx="70" ry="52" fill="url(#heat)"/><ellipse cx="110" cy="121" rx="42" ry="26" fill="none" stroke="#da930d" stroke-width="3" stroke-dasharray="7 5"/><circle cx="110" cy="121" r="6" fill="#d98900"/><text x="22" y="217" fill="#3f5868" font-size="15">mean μ + covariance Σ</text><text x="22" y="241" fill="#3f5868" font-size="15">over a temporal window</text><text x="22" y="274" fill="#865a0a" font-size="13">Never reduce to one click.</text></g>
  <g transform="translate(584 88)"><rect width="220" height="300" rx="20" fill="#edf1f6" stroke="#b8c5d0"/><text x="22" y="34" fill="#17364c" font-size="14" font-weight="850">3 · FUSE EVIDENCE</text><g transform="translate(22 70)"><rect width="48" height="42" rx="8" fill="#7da4ae"/><rect x="58" width="48" height="42" rx="8" fill="#7da4ae"/><rect x="116" width="48" height="42" rx="8" fill="#7da4ae"/><text x="17" y="69" fill="#4e6676" font-size="12">.09</text><text x="75" y="69" fill="#087e8b" font-size="12" font-weight="850">.82</text><text x="133" y="69" fill="#4e6676" font-size="12">.09</text></g><text x="22" y="176" fill="#3f5868" font-size="15">mask overlap × language</text><text x="22" y="200" fill="#3f5868" font-size="15">compatibility × quality</text><text x="22" y="237" fill="#17364c" font-size="14" font-weight="800">P(object | gaze, words, image)</text><text x="22" y="274" fill="#865a0a" font-size="13">Compare top-two candidates.</text></g>
  <g transform="translate(852 88)"><rect width="220" height="300" rx="20" fill="#e8f4ec" stroke="#aacbb5"/><text x="22" y="34" fill="#2d7a4c" font-size="14" font-weight="850">4 · DECIDE</text><rect x="22" y="69" width="176" height="54" rx="13" fill="#2d7a4c"/><text x="52" y="102" fill="white" font-size="16" font-weight="800">accept + confirm</text><text x="102" y="153" fill="#7d8e98" font-size="13" text-anchor="middle">or</text><rect x="22" y="170" width="176" height="54" rx="13" fill="#d85f45"/><text x="52" y="203" fill="white" font-size="16" font-weight="800">abstain + clarify</text><text x="22" y="257" fill="#3f5868" font-size="14">Low confidence, small margin,</text><text x="22" y="280" fill="#3f5868" font-size="14">or invalid gaze blocks motion.</text></g>
  <path d="M270 239h42M538 239h42M806 239h42" stroke="#879ca8" stroke-width="4"/></g>
</svg>
