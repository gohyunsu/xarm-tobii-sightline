<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 570" role="img" aria-labelledby="title desc">
  <title id="title">GazePick beginner journey</title><desc id="desc">Six connected stages show an ambiguous scene, gaze and language reference, uncertainty-aware fusion, VLA proposal, guarded xArm execution, and separate intent and mechanical evaluation.</desc>
  <defs><linearGradient id="dark" x2="1" y2="1"><stop stop-color="#10263a"/><stop offset="1" stop-color="#0c5b61"/></linearGradient><linearGradient id="mint"><stop stop-color="#dff4f0"/><stop offset="1" stop-color="#edf8f5"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#10263a" flood-opacity=".1"/></filter></defs>
  <rect width="1180" height="570" rx="30" fill="#f8faf8"/>
  <g font-family="system-ui"><text x="52" y="54" fill="#607381" font-size="16" font-weight="800" letter-spacing="2.4">THE WHOLE PROJECT IN ONE LINE OF REASONING</text>
  <path d="M116 292H1062" stroke="#bdd0ce" stroke-width="4" stroke-linecap="round"/><path d="M1048 280l16 12-16 12" fill="none" stroke="#bdd0ce" stroke-width="4"/>
  <g transform="translate(42 108)"><rect width="170" height="330" rx="22" fill="white" stroke="#d1dddc" filter="url(#shadow)"/><circle cx="34" cy="38" r="18" fill="#df684a"/><text x="34" y="44" text-anchor="middle" fill="white" font-size="15" font-weight="850">1</text><text x="22" y="84" fill="#a94a36" font-size="13" font-weight="850">AMBIGUOUS SCENE</text><g transform="translate(20 112)"><rect width="38" height="48" rx="8" fill="#7fa7ae"/><rect x="45" width="38" height="48" rx="8" fill="#82aab1"/><rect x="90" width="38" height="48" rx="8" fill="#7fa6ad"/></g><text x="22" y="198" fill="#10263a" font-size="19" font-weight="800">Three parts look</text><text x="22" y="222" fill="#10263a" font-size="19" font-weight="800">nearly the same.</text><text x="22" y="268" fill="#607381" font-size="14">Language alone leaves</text><text x="22" y="290" fill="#607381" font-size="14">more than one plausible</text><text x="22" y="312" fill="#607381" font-size="14">source object.</text></g>
  <g transform="translate(227 108)"><rect width="170" height="330" rx="22" fill="url(#mint)" stroke="#bddbd7" filter="url(#shadow)"/><circle cx="34" cy="38" r="18" fill="#087b82"/><text x="34" y="44" text-anchor="middle" fill="white" font-size="15" font-weight="850">2</text><text x="22" y="84" fill="#087b82" font-size="13" font-weight="850">HUMAN REFERENCE</text><ellipse cx="78" cy="140" rx="48" ry="31" fill="#f5c557" opacity=".46"/><circle cx="78" cy="140" r="7" fill="#dc930d"/><path d="M110 124q36-22 43-55" fill="none" stroke="#dc930d" stroke-width="2"/><text x="22" y="198" fill="#10263a" font-size="19" font-weight="800">Gaze says which.</text><text x="22" y="224" fill="#10263a" font-size="19" font-weight="800">Words say where.</text><text x="22" y="268" fill="#607381" font-size="14">“Put this in the blue</text><text x="22" y="290" fill="#607381" font-size="14">bin.” Both signals refer</text><text x="22" y="312" fill="#607381" font-size="14">to the same moment.</text></g>
  <g transform="translate(412 108)"><rect width="170" height="330" rx="22" fill="white" stroke="#d1dddc" filter="url(#shadow)"/><circle cx="34" cy="38" r="18" fill="#087b82"/><text x="34" y="44" text-anchor="middle" fill="white" font-size="15" font-weight="850">3</text><text x="22" y="84" fill="#087b82" font-size="13" font-weight="850">FUSE + ABSTAIN</text><rect x="24" y="116" width="120" height="11" rx="6" fill="#dce7e5"/><rect x="24" y="116" width="96" height="11" rx="6" fill="#0a969a"/><text x="24" y="155" fill="#10263a" font-size="14" font-weight="800">B · 0.82</text><text x="22" y="198" fill="#10263a" font-size="19" font-weight="800">Estimate candidates,</text><text x="22" y="222" fill="#10263a" font-size="19" font-weight="800">not one gaze point.</text><text x="22" y="268" fill="#607381" font-size="14">Low confidence, poor</text><text x="22" y="290" fill="#607381" font-size="14">quality, or a small margin</text><text x="22" y="312" fill="#a9443e" font-size="14" font-weight="750">means ask—do not guess.</text></g>
  <g transform="translate(597 108)"><rect width="170" height="330" rx="22" fill="#e9eef1" stroke="#c5d0d5" filter="url(#shadow)"/><circle cx="34" cy="38" r="18" fill="#193b4f"/><text x="34" y="44" text-anchor="middle" fill="white" font-size="15" font-weight="850">4</text><text x="22" y="84" fill="#193b4f" font-size="13" font-weight="850">VLA PROPOSAL</text><path d="M27 127h116M27 146h82M27 165h98" stroke="#78909d" stroke-width="7" stroke-linecap="round"/><text x="22" y="208" fill="#10263a" font-size="19" font-weight="800">Vision + instruction</text><text x="22" y="232" fill="#10263a" font-size="19" font-weight="800">become an action.</text><text x="22" y="274" fill="#607381" font-size="14">The learned policy may</text><text x="22" y="296" fill="#607381" font-size="14">output a skill, pose, or</text><text x="22" y="318" fill="#607381" font-size="14">short action chunk.</text></g>
  <g transform="translate(782 108)"><rect width="170" height="330" rx="22" fill="url(#dark)" filter="url(#shadow)"/><circle cx="34" cy="38" r="18" fill="#9be2dc"/><text x="34" y="44" text-anchor="middle" fill="#10263a" font-size="15" font-weight="850">5</text><text x="22" y="84" fill="#9be2dc" font-size="13" font-weight="850">GUARDED xARM</text><path d="M35 169q10-71 54-77l18 19q-34 20-30 72M77 183l-24 32M77 183l33 32" fill="none" stroke="white" stroke-width="13" stroke-linecap="round"/><text x="22" y="249" fill="white" font-size="19" font-weight="800">Permission remains</text><text x="22" y="273" fill="white" font-size="19" font-weight="800">outside the VLA.</text><text x="22" y="311" fill="#bed2d7" font-size="14">Confirm, workspace, path,</text><text x="22" y="333" fill="#bed2d7" font-size="14">speed, fault, and E-stop.</text></g>
  <g transform="translate(967 108)"><rect width="170" height="330" rx="22" fill="white" stroke="#d1dddc" filter="url(#shadow)"/><circle cx="34" cy="38" r="18" fill="#2d7a4c"/><text x="34" y="44" text-anchor="middle" fill="white" font-size="15" font-weight="850">6</text><text x="22" y="84" fill="#2d7a4c" font-size="13" font-weight="850">SEPARATE SCORES</text><circle cx="55" cy="145" r="27" fill="#e3f3e8"/><path d="M43 145l8 8 17-20" fill="none" stroke="#2d7a4c" stroke-width="5"/><circle cx="116" cy="145" r="27" fill="#e5f2f2"/><path d="M104 145l8 8 17-20" fill="none" stroke="#087b82" stroke-width="5"/><text x="22" y="206" fill="#10263a" font-size="19" font-weight="800">Right object?</text><text x="22" y="232" fill="#10263a" font-size="19" font-weight="800">Right placement?</text><text x="22" y="276" fill="#607381" font-size="14">Intent success and robot</text><text x="22" y="298" fill="#607381" font-size="14">mechanics are reported</text><text x="22" y="320" fill="#607381" font-size="14">as different outcomes.</text></g>
  <text x="590" y="506" text-anchor="middle" fill="#607381" font-size="14">If any stage cannot be reconstructed from the episode log, the research chain is incomplete.</text></g>
</svg>
