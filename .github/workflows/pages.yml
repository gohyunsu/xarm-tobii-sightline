name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enforce English-only text assets
        shell: bash
        run: |
          if grep -RInP '[\x{AC00}-\x{D7A3}\x{3131}-\x{318E}\x{1100}-\x{11FF}]' \
            --exclude-dir=.git \
            --include='*.html' --include='*.md' --include='*.svg' \
            --include='*.css' --include='*.js' .; then
            echo 'Korean text found in a published or repository-visible asset.'
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
